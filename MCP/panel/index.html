<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notebook</title><style>/* NOTEBOOK_STYLE */</style></head>
<body>
  <header><button id="back" aria-label="Вернуться на предыдущую доску" hidden>‹</button><strong>Notebook</strong><span id="surface-name"></span>
    <span id="page-navigation" hidden><button id="page-previous" aria-label="Предыдущий лист">‹</button><span id="page-position"></span><button id="page-next" aria-label="Следующий лист">›</button></span>
    <span id="status" role="status">Подключение…</span></header>
  <main id="workspace" tabindex="0" aria-label="Рабочая поверхность Notebook">
    <svg id="paper" xmlns="http://www.w3.org/2000/svg" aria-label="Доска Notebook"><g id="material"></g><g id="selection"></g></svg>
    <textarea id="text-editor" aria-label="Текст элемента" hidden spellcheck="false"></textarea>
    <span id="coverage"></span>
    <div id="message" role="alert" hidden><span></span><button id="retry">Повторить</button></div>
  </main>
  <nav aria-label="Инструменты Notebook">
    <button data-tool="select" aria-label="Выделение (V)" title="Выделение (V). Перетаскивание пустого места двигает доску" aria-pressed="true">↖</button>
    <button data-tool="hand" aria-label="Перемещение доски (H)" title="Перемещение доски (H), пробел или средняя кнопка" aria-pressed="false">✋</button>
    <button data-tool="text" aria-label="Текст (T)" title="Текст (T). ⌘Enter — сохранить, Escape — отменить" aria-pressed="false">T</button>
    <button data-tool="rectangle" aria-label="Прямоугольник" aria-pressed="false">□</button>
    <button data-tool="ellipse" aria-label="Эллипс" aria-pressed="false">○</button>
    <button data-tool="connector" aria-label="Стрелка" aria-pressed="false">↗</button>
    <span class="divider"></span>
    <button id="undo" aria-label="Отменить свою правку" disabled>↶</button>
    <button id="delete" aria-label="Удалить выделенное" disabled>⌫</button>
    <span class="divider"></span>
    <button id="zoom-out" aria-label="Уменьшить масштаб">−</button><span id="zoom-level" aria-label="Текущий масштаб">100%</span><button id="zoom-in" aria-label="Увеличить масштаб">+</button><button id="zoom-fit" aria-label="Общий вид" title="Показать весь материал">Общий вид</button>
  </nav>
  <script type="module">/* NOTEBOOK_SCRIPT */</script>
</body></html>
