<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Notebook</title>
  <desc id="description">A warm ivory notebook fills the app icon. Seven brushed steel binding rings hold its left edge; a woven slate-blue elastic secures the right side. Fine page edges remain visible below the cover.</desc>
  <defs>
    <linearGradient id="paperEdge" x1="0" y1="946" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8f5ed"/>
      <stop offset=".55" stop-color="#ded8cd"/>
      <stop offset="1" stop-color="#bdb5a8"/>
    </linearGradient>
    <linearGradient id="cover" x1="192" y1="0" x2="832" y2="1040" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf7"/>
      <stop offset=".48" stop-color="#f7f2e7"/>
      <stop offset="1" stop-color="#e9e1d2"/>
    </linearGradient>
    <radialGradient id="coverLight" cx="34%" cy="22%" r="91%">
      <stop stop-color="#ffffff" stop-opacity=".52"/>
      <stop offset=".65" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#b2a48b" stop-opacity=".08"/>
    </radialGradient>
    <linearGradient id="bindingFold" x1="0" y1="0" x2="175" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b8b0a0" stop-opacity=".35"/>
      <stop offset=".29" stop-color="#d0c7b6" stop-opacity=".07"/>
      <stop offset=".49" stop-color="#998b73" stop-opacity=".19"/>
      <stop offset=".62" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="-20" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#536267"/>
      <stop offset=".16" stop-color="#b6c1c2"/>
      <stop offset=".32" stop-color="#f8faf6"/>
      <stop offset=".43" stop-color="#d9deda"/>
      <stop offset=".59" stop-color="#778689"/>
      <stop offset=".83" stop-color="#46565b"/>
      <stop offset="1" stop-color="#98a6a8"/>
    </linearGradient>
    <linearGradient id="steelTip" x1="83" y1="0" x2="129" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5b1b2" stop-opacity="0"/>
      <stop offset="1" stop-color="#29383c" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="punchedHole" x1="111" y1="-17" x2="135" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#675e4e"/>
      <stop offset=".5" stop-color="#323431"/>
      <stop offset="1" stop-color="#a59c89"/>
    </linearGradient>
    <linearGradient id="elastic" x1="794" y1="0" x2="875" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#354b5b"/>
      <stop offset=".07" stop-color="#677d8b"/>
      <stop offset=".18" stop-color="#718693"/>
      <stop offset=".51" stop-color="#607685"/>
      <stop offset=".88" stop-color="#526877"/>
      <stop offset="1" stop-color="#344a5a"/>
    </linearGradient>
    <linearGradient id="elasticLight" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8e4e6" stop-opacity=".14"/>
      <stop offset=".3" stop-color="#d8e4e6" stop-opacity="0"/>
      <stop offset=".83" stop-color="#142d3e" stop-opacity=".03"/>
      <stop offset="1" stop-color="#142d3e" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="elasticContact" x1="875" y1="0" x2="904" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#746650" stop-opacity=".23"/>
      <stop offset="1" stop-color="#746650" stop-opacity="0"/>
    </linearGradient>
    <pattern id="wovenElastic" width="6" height="8" patternUnits="userSpaceOnUse">
      <path d="M1 0V8" stroke="#d4dfe0" stroke-opacity=".16" stroke-width="1"/>
      <path d="M3 0V8" stroke="#213e50" stroke-opacity=".19" stroke-width="1"/>
      <path d="M0 2H6M0 6H6" stroke="#172f41" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
    <pattern id="paperFibre" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M1 2h1M8 1h1M4 7h1M10 9h1M1 11h1" stroke="#8f8169" stroke-opacity=".038" stroke-width=".7"/>
      <path d="M5 3h1M2 8h1M9 5h1M6 11h1" stroke="#ffffff" stroke-opacity=".38" stroke-width=".6"/>
    </pattern>
    <linearGradient id="elasticUnder" x1="784" y1="0" x2="889" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#514b3e" stop-opacity="0"/>
      <stop offset=".09" stop-color="#514b3e" stop-opacity=".13"/>
      <stop offset=".18" stop-color="#514b3e" stop-opacity=".22"/>
      <stop offset=".87" stop-color="#514b3e" stop-opacity=".22"/>
      <stop offset="1" stop-color="#514b3e" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="coverClip"><path d="M-16-20H1040V934Q1040 990 976 990H60Q-16 990-16 914Z"/></clipPath>
    <path id="ringCurve" d="M123-4C90-17 43-20 5-16C-31-12-48 2-40 17C-29 37 23 43 87 35" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="bindingRing">
      <rect x="103" y="-19" width="37" height="35" rx="14" fill="#fffdf5" fill-opacity=".72"/>
      <rect x="105" y="-17" width="33" height="31" rx="13" fill="url(#punchedHole)"/>
      <path d="M111 11Q122 18 134 9" fill="none" stroke="#b9ae99" stroke-width="1.3"/>
      <g transform="translate(2 5)" stroke="#645a48">
        <g opacity=".014"><use href="#ringCurve" stroke-width="30"/></g>
        <g opacity=".020"><use href="#ringCurve" stroke-width="26"/></g>
        <g opacity=".034"><use href="#ringCurve" stroke-width="22"/></g>
        <g opacity=".055"><use href="#ringCurve" stroke-width="18"/></g>
        <g opacity=".080"><use href="#ringCurve" stroke-width="14"/></g>
      </g>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <use href="#ringCurve" stroke="#435154" stroke-width="16"/>
        <use href="#ringCurve" stroke="url(#steel)" stroke-width="12"/>
        <use href="#ringCurve" stroke="url(#steelTip)" stroke-width="12"/>
        <path d="M114-7C79-19 38-21 3-17" stroke="#fffef9" stroke-opacity=".85" stroke-width="1.6"/>
        <path d="M1 36Q37 42 83 36" stroke="#d6deda" stroke-opacity=".68" stroke-width="1.4"/>
      </g>
    </g>
  </defs>

  <g id="pageBlock">
    <rect width="1024" height="1024" fill="url(#paperEdge)"/>
    <path d="M-10 948Q-2 1005 67 1005H978Q1017 1005 1034 983M-10 961Q1 1013 67 1013H978Q1017 1013 1034 992M-10 974Q6 1021 70 1021H978Q1019 1021 1034 1002" fill="none" stroke="#958b79" stroke-opacity=".35" stroke-width="2"/>
    <path d="M6 968Q18 1001 75 1001H974" fill="none" stroke="#fffdf5" stroke-opacity=".9" stroke-width="2"/>
  </g>
  <g id="ivoryCover">
    <path d="M-16-20H1040V938Q1040 996 976 996H60Q-16 996-16 920Z" fill="#7e725e" fill-opacity=".22"/>
    <g clip-path="url(#coverClip)">
      <rect x="-16" y="-20" width="1056" height="1030" fill="url(#cover)"/>
      <rect width="1024" height="1000" fill="url(#paperFibre)"/>
      <rect width="1024" height="1000" fill="url(#coverLight)"/>
      <rect width="175" height="1000" fill="url(#bindingFold)"/>
    </g>
    <path d="M6 936Q7 982 67 982H973Q1022 982 1028 947" fill="none" stroke="#fffdf6" stroke-opacity=".76" stroke-width="2.5"/>
    <path d="M63 990H976" fill="none" stroke="#ad9f87" stroke-opacity=".33" stroke-width="1.5"/>
  </g>
  <g id="sevenSteelRings">
    <use href="#bindingRing" transform="translate(0 102)"/>
    <use href="#bindingRing" transform="translate(0 235)"/>
    <use href="#bindingRing" transform="translate(0 368)"/>
    <use href="#bindingRing" transform="translate(0 501)"/>
    <use href="#bindingRing" transform="translate(0 634)"/>
    <use href="#bindingRing" transform="translate(0 767)"/>
    <use href="#bindingRing" transform="translate(0 900)"/>
  </g>
  <g id="slateElastic">
    <rect x="784" width="105" height="1024" fill="url(#elasticUnder)"/>
    <rect x="875" width="29" height="1024" fill="url(#elasticContact)"/>
    <rect x="794" y="-4" width="81" height="1032" fill="url(#elastic)"/>
    <rect x="797" width="75" height="1024" fill="url(#wovenElastic)"/>
    <rect x="794" width="81" height="1024" fill="url(#elasticLight)"/>
    <path d="M797 0V1024" stroke="#b4c4c9" stroke-opacity=".48" stroke-width="1.2"/>
    <path d="M872 0V1024" stroke="#243c4b" stroke-opacity=".40" stroke-width="1.2"/>
  </g>
</svg>
