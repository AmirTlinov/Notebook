<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ink blue notebook</title>
  <desc id="desc">A slim ink blue notebook with soft upper-left lighting, rounded bindings, a gently beveled cover and a thin edge of warm cream paper. Two short cream lines decorate the cover. Transparent background.</desc>

  <defs>
    <linearGradient id="back-fill" x1="32" y1="11.6" x2="76" y2="83.6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#566B9E"/>
      <stop offset="1" stop-color="#2F3F6B"/>
    </linearGradient>
    <linearGradient id="paper-fill" x1="44" y1="10.2" x2="80" y2="82.2" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFCF5"/>
      <stop offset="0.6" stop-color="#FAF3E5"/>
      <stop offset="1" stop-color="#EBDFC9"/>
    </linearGradient>
    <linearGradient id="cover-fill" x1="22" y1="8" x2="77" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6B80B8"/>
      <stop offset="0.48" stop-color="#546CA7"/>
      <stop offset="1" stop-color="#45598B"/>
    </linearGradient>
    <linearGradient id="cover-edge" x1="22" y1="8" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DBE5FF" stop-opacity="0.32"/>
      <stop offset="0.42" stop-color="#DBE5FF" stop-opacity="0.05"/>
      <stop offset="0.64" stop-color="#213259" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#213259" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="binding-fill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7085BC"/>
      <stop offset="0.28" stop-color="#627AB1"/>
      <stop offset="0.7" stop-color="#556CA7"/>
      <stop offset="1" stop-color="#4A5F95"/>
    </linearGradient>
    <linearGradient id="binding-edge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#DBE5FF" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#DBE5FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#213259" stop-opacity="0.2"/>
    </linearGradient>
    <path id="paper-shape" d="M32 10.2H72.2A9 9 0 0 1 81.2 19.2V73.2A9 9 0 0 1 72.2 82.2H29.2A9 9 0 0 1 20.2 73.2V71H32Z"/>
    <path id="cover-shape" d="M27 8H70A9 9 0 0 1 79 17V71A9 9 0 0 1 70 80H27A9 9 0 0 1 18 71V69.5H24.5A5.5 5.5 0 0 0 24.5 58.5H18V50.5H24.5A5.5 5.5 0 0 0 24.5 39.5H18V31.5H24.5A5.5 5.5 0 0 0 24.5 20.5H18V17A9 9 0 0 1 27 8Z"/>
    <clipPath id="paper-clip"><use href="#paper-shape"/></clipPath>
    <clipPath id="cover-clip"><use href="#cover-shape"/></clipPath>
  </defs>

  <g id="back-cover" fill="url(#back-fill)">
    <path d="M32 11.6H73.6A9 9 0 0 1 82.6 20.6V74.6A9 9 0 0 1 73.6 83.6H30.6A9 9 0 0 1 21.6 74.6V71H32Z"/>
  </g>

  <g id="pages">
    <use href="#paper-shape" fill="url(#paper-fill)"/>
    <g id="page-edges" clip-path="url(#paper-clip)" stroke="#B4A48B" stroke-width="0.3" opacity="0.3">
      <path d="M80.6 24V73.2A8.4 8.4 0 0 1 72.2 81.6H29.2A8.4 8.4 0 0 1 20.8 73.2V72"/>
    </g>
    <g id="cover-contact-shadow" clip-path="url(#paper-clip)">
      <use href="#cover-shape" transform="translate(0.55 0.7)" fill="#293959" opacity="0.1"/>
    </g>
  </g>

  <g id="front-cover">
    <use href="#cover-shape" fill="url(#cover-fill)"/>
    <use href="#cover-shape" clip-path="url(#cover-clip)" stroke="url(#cover-edge)" stroke-width="1"/>
  </g>

  <g id="binding" fill="url(#binding-fill)" stroke="url(#binding-edge)" stroke-width="0.45">
    <rect x="9" y="22.5" width="19" height="7" rx="3.5"/>
    <rect x="9" y="41.5" width="19" height="7" rx="3.5"/>
    <rect x="9" y="60.5" width="19" height="7" rx="3.5"/>
  </g>

  <g id="cover-lettering" stroke="#FAF3E5" stroke-width="3" stroke-linecap="round">
    <path d="M44 29H62"/>
    <path d="M44 37H55"/>
  </g>
</svg>
