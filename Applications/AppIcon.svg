<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Notebook app icon</title>
  <desc id="description">A full-frame blue grid notebook cover with a spine, paper label, page edges, and elastic band.</desc>
  <defs>
    <linearGradient id="coverFill" x1="120" y1="32" x2="900" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fb3c5"/>
      <stop offset="1" stop-color="#4d8195"/>
    </linearGradient>
    <linearGradient id="spineFill" x1="0" y1="0" x2="220" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3e7185"/>
      <stop offset="1" stop-color="#285467"/>
    </linearGradient>
    <linearGradient id="pageFill" x1="930" y1="120" x2="1010" y2="1010" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#ded7ca"/>
    </linearGradient>
    <clipPath id="coverClip">
      <path d="M0 0H944V944H0Z"/>
    </clipPath>
  </defs>

  <g id="pageBlock">
    <rect width="1024" height="1024" fill="url(#pageFill)"/>
    <path d="M966 72V914M988 104V884M92 966H914M124 988H884" fill="none" stroke="#bdb5a8" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
  </g>

  <g id="cover" clip-path="url(#coverClip)">
    <rect width="944" height="944" fill="url(#coverFill)"/>
    <g id="grid" fill="none" stroke="#e7f3f5" stroke-width="5" opacity="0.24">
      <path d="M250 0V944M354 0V944M458 0V944M562 0V944M666 0V944M770 0V944M874 0V944"/>
      <path d="M0 112H944M0 216H944M0 320H944M0 424H944M0 528H944M0 632H944M0 736H944M0 840H944"/>
    </g>
    <path d="M0 0H220V944H0Z" fill="url(#spineFill)"/>
    <path d="M174 0V944" fill="none" stroke="#9bc6d3" stroke-width="13" opacity="0.68"/>
    <path d="M204 0V944" fill="none" stroke="#1d4658" stroke-width="7" opacity="0.72"/>
    <path d="M812 0H884V944H812Z" fill="#173b4a"/>
    <path d="M824 0H840V944H824Z" fill="#3c6979" opacity="0.72"/>
  </g>

  <g id="label">
    <rect x="340" y="332" width="334" height="280" rx="54" fill="#fffdf7"/>
    <path d="M398 412H616M398 474H588M398 536H548" fill="none" stroke="#54899d" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
