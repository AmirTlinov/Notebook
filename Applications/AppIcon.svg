<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Notebook app icon</title>
  <desc id="description">A closed blue grid notebook with a dark spine and elastic band on warm paper.</desc>
  <defs>
    <linearGradient id="backgroundFill" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#eee8dc"/>
    </linearGradient>
    <linearGradient id="coverFill" x1="252" y1="128" x2="738" y2="854" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#84b8ca"/>
      <stop offset="1" stop-color="#5d91a6"/>
    </linearGradient>
    <linearGradient id="spineFill" x1="220" y1="128" x2="324" y2="848" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#47788c"/>
      <stop offset="1" stop-color="#315f72"/>
    </linearGradient>
    <linearGradient id="pageBlock" x1="300" y1="162" x2="804" y2="891" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffef9"/>
      <stop offset="1" stop-color="#e5dfd2"/>
    </linearGradient>
    <filter id="bookShadow" x="90" y="70" width="850" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="20" dy="28" stdDeviation="24" flood-color="#263238" flood-opacity="0.25"/>
    </filter>
    <clipPath id="coverClip">
      <rect x="220" y="126" width="548" height="724" rx="76"/>
    </clipPath>
  </defs>

  <g id="background">
    <rect width="1024" height="1024" fill="url(#backgroundFill)"/>
    <path d="M0 744L744 0M0 872L872 0M152 1024L1024 152M280 1024L1024 280" stroke="#d9d2c5" stroke-width="2" opacity="0.22"/>
  </g>

  <g id="notebook" filter="url(#bookShadow)">
    <g id="pages">
      <rect x="274" y="158" width="530" height="734" rx="72" fill="url(#pageBlock)" stroke="#c8c1b5" stroke-width="8"/>
      <path d="M768 212V832M783 228V816M300 856H744M316 872H728" fill="none" stroke="#bbb4a8" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
    </g>

    <g id="cover">
      <rect x="220" y="126" width="548" height="724" rx="76" fill="url(#coverFill)" stroke="#315f72" stroke-width="10"/>
      <g id="coverGrid" clip-path="url(#coverClip)" fill="none" stroke="#e9f4f6" stroke-width="4" opacity="0.22">
        <path d="M348 126V850M424 126V850M500 126V850M576 126V850M652 126V850"/>
        <path d="M220 278H768M220 354H768M220 430H768M220 506H768M220 582H768M220 658H768M220 734H768"/>
      </g>
      <path d="M304 148V828" fill="none" stroke="#a9d0dd" stroke-width="7" opacity="0.68"/>
      <path d="M326 151V825" fill="none" stroke="#274e5e" stroke-width="4" opacity="0.38"/>
    </g>

    <g id="spine">
      <path d="M296 126H220C178 126 144 160 144 202V774C144 816 178 850 220 850H296Z" fill="url(#spineFill)" stroke="#315f72" stroke-width="10"/>
      <path d="M205 170V806" fill="none" stroke="#8eb7c7" stroke-width="8" stroke-linecap="round" opacity="0.62"/>
    </g>

    <g id="elasticBand">
      <path d="M660 126H716V850H660Z" fill="#173b4a"/>
      <path d="M670 126H682V850H670Z" fill="#315e70" opacity="0.72"/>
    </g>

    <g id="coverLabel">
      <rect x="398" y="380" width="190" height="146" rx="24" fill="#fffdf7" stroke="#315f72" stroke-width="7"/>
      <path d="M432 426H554M432 463H538M432 500H514" fill="none" stroke="#6c9eb1" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>
</svg>
