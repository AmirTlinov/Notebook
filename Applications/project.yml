name: Notebook

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"

packages:
  NotebookCore:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ENABLE_MODULES: true
    NOTEBOOK_BUNDLE_SUFFIX: ""
    NOTEBOOK_MAC_BUNDLE_SUFFIX: $(NOTEBOOK_BUNDLE_SUFFIX)
    NOTEBOOK_SCRIPT_BUNDLE_SUFFIX: $(NOTEBOOK_BUNDLE_SUFFIX)
    NOTEBOOK_ACCEPTANCE_ENABLED: NO
    NOTEBOOK_IPAD_ENTITLEMENTS: ""
    NOTEBOOK_CLOUD_CONTAINER: ""
    NOTEBOOK_TYPESETTER_RUNTIME: $(SRCROOT)/../.build/notebook-typesetter-runtime
    NOTEBOOK_CODEX_RUNTIME: $(SRCROOT)/../.build/notebook-codex-runtime

targets:
  Notebook:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iPad
      - path: Assets.xcassets
      - path: WebResources
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Install canonical typesetter resources
        script: /usr/bin/env python3 -B "$SRCROOT/bundle_notebook_typesetter.py"
        inputFiles:
          - $(SRCROOT)/bundle_notebook_typesetter.py
          - $(NOTEBOOK_TYPESETTER_RUNTIME)/manifest.json
          - $(NOTEBOOK_TYPESETTER_RUNTIME)/Resources
        outputFileLists:
          - $(SRCROOT)/NotebookTypesetterResources.xcfilelist

    dependencies:
      - package: NotebookCore
        product: NotebookTypesetter
      - package: NotebookCore
        product: NotebookCore
    info:
      path: iPad/Info.plist
      properties:
        CFBundleDisplayName: $(NOTEBOOK_DISPLAY_NAME)
        NotebookAcceptanceEnabled: $(NOTEBOOK_ACCEPTANCE_ENABLED)
        NotebookCloudContainer: $(NOTEBOOK_CLOUD_CONTAINER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Диктовка и голосовой разговор передают речь в Codex через вашу существующую учётную запись. В открытом Notebook обращение GPT распознаётся локально; микрофон можно выключить. До обращения звук не отправляется.
        NSSpeechRecognitionUsageDescription: Обращение к GPT распознаётся только на iPad. Окружающая речь не передаётся агенту до обращения; это не диктовка текста.
        NSLocalNetworkUsageDescription: Notebook использует локальную сеть для быстрого обмена с вашим Mac.
        NSBonjourServices:
          - _notebook._tcp
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook$(NOTEBOOK_BUNDLE_SUFFIX)
        PRODUCT_NAME: Notebook
        OTHER_LDFLAGS: "$(inherited) $(NOTEBOOK_TYPESETTER_RUNTIME)/$(PLATFORM_NAME)/libnotebook_typesetter_runtime.a -liconv -lresolv -framework Security"
        NOTEBOOK_DISPLAY_NAME: Notebook
        MARKETING_VERSION: 0.3.134
        CURRENT_PROJECT_VERSION: 156
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: $(NOTEBOOK_IPAD_ENTITLEMENTS)
        DEVELOPMENT_TEAM: M94V58FCVP
        TARGETED_DEVICE_FAMILY: 2
        SUPPORTS_MACCATALYST: false
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
      testTargets:
        - NotebookTests
        - NotebookUITests

  NotebookTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests
      - path: TestSupport
      - path: ../MCP/skills/notebook/assets/science
        type: folder
        buildPhase: resources
      - path: ../Tests/NotebookCoreTests/Resources/QuickShapeMeasured.json
        buildPhase: resources
      - path: ../MCP/skills/notebook/assets/animation
        type: folder
        buildPhase: resources
    dependencies:
      - target: Notebook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook.tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: 2

  NotebookUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: UITests
      - path: TestSupport/ProgramAssets/compiled-program.json
        buildPhase: resources
      - path: TestSupport/ProgramAssets/signal-program.json
        buildPhase: resources
      - path: TestSupport/ProgramAssets/gears-program.json
        buildPhase: resources
      - path: TestSupport/ProgramAssets/wave-program.json
        buildPhase: resources
      - path: ../MCP/skills/notebook/assets/science
        type: folder
        buildPhase: resources
      - path: ../MCP/skills/notebook/assets/animation
        type: folder
        buildPhase: resources
    dependencies:
      - target: Notebook
    info:
      path: UITests/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook.uitests
        GENERATE_INFOPLIST_FILE: false
        TEST_TARGET_NAME: Notebook
        TARGETED_DEVICE_FAMILY: 2

  NotebookMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Mac
      - path: Assets.xcassets
      - path: WebResources
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Install canonical typesetter resources
        script: /usr/bin/env python3 -B "$SRCROOT/bundle_notebook_typesetter.py"
        inputFiles:
          - $(SRCROOT)/bundle_notebook_typesetter.py
          - $(NOTEBOOK_TYPESETTER_RUNTIME)/manifest.json
          - $(NOTEBOOK_TYPESETTER_RUNTIME)/Resources
        outputFileLists:
          - $(SRCROOT)/NotebookTypesetterResources.xcfilelist

    preBuildScripts:
      - name: Bundle official Codex and Node runtimes
        script: |
          /usr/bin/python3 "$SRCROOT/prepare_notebook_codex.py" --stage "$NOTEBOOK_CODEX_RUNTIME" --bundle "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/CodexRuntime"
        inputFiles:
          - $(SRCROOT)/prepare_notebook_codex.py
          - $(SRCROOT)/NotebookCodexResources.xcfilelist
          - $(NOTEBOOK_CODEX_RUNTIME)
        outputFileLists:
          - $(SRCROOT)/NotebookCodexResources.xcfilelist
      - name: Bundle Notebook tools
        script: |
          /usr/bin/env node "$SRCROOT/../MCP/build-sidecar.mjs" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/NotebookTools"
        inputFiles:
          - $(SRCROOT)/../MCP/src
          - $(SRCROOT)/../MCP/package-lock.json
          - $(SRCROOT)/../MCP/build-sidecar.mjs
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/NotebookTools/dist/index.mjs
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/NotebookTools/package.json
    dependencies:
      - package: NotebookCore
        product: NotebookTypesetter
      - package: NotebookCore
        product: NotebookCore
      - package: NotebookCore
        product: NotebookCodex
      - package: NotebookCore
        product: NotebookScriptHost
      - target: NotebookScriptService
        embed: true
      - target: NotebookMarkupService
        embed: true
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Notebook
        NotebookAcceptanceEnabled: $(NOTEBOOK_ACCEPTANCE_ENABLED)
        NotebookCloudContainer: $(NOTEBOOK_CLOUD_CONTAINER)
        NotebookScriptService: com.amirtlinov.notebook.script-service$(NOTEBOOK_SCRIPT_BUNDLE_SUFFIX)
        NotebookMarkupService: com.amirtlinov.notebook.markup-service$(NOTEBOOK_SCRIPT_BUNDLE_SUFFIX)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSLocalNetworkUsageDescription: Notebook использует локальную сеть для быстрого обмена с вашим iPad.
        NSBonjourServices:
          - _notebook._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook.mac$(NOTEBOOK_MAC_BUNDLE_SUFFIX)
        CODE_SIGN_ENTITLEMENTS: $(NOTEBOOK_MAC_ENTITLEMENTS)
        PRODUCT_NAME: Notebook
        OTHER_LDFLAGS: "$(inherited) $(NOTEBOOK_TYPESETTER_RUNTIME)/$(PLATFORM_NAME)/libnotebook_typesetter_runtime.a -liconv -lresolv -framework Security"
        MARKETING_VERSION: 0.3.134
        CURRENT_PROJECT_VERSION: 156
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: M94V58FCVP
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
      testTargets:
        - NotebookMacTests

  NotebookMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacTests
      - path: TestSupport
      - path: ../MCP/skills/notebook/assets/science
        type: folder
        buildPhase: resources
      - path: ../Tests/NotebookCoreTests/Resources/QuickShapeMeasured.json
        buildPhase: resources
    dependencies:
      - target: NotebookMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook.mac.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Notebook.app/Contents/MacOS/Notebook
        BUNDLE_LOADER: $(TEST_HOST)

  NotebookScriptService:
    type: xpc-service
    platform: macOS
    sources:
      - path: ../Sources/NotebookScriptService/main.swift
      - path: ../Sources/NotebookScriptWorker/Resources/notebook-sdk.js
        buildPhase: resources
    dependencies:
      - package: NotebookCore
        product: NotebookScriptWorker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook.script-service$(NOTEBOOK_SCRIPT_BUNDLE_SUFFIX)
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ../Sources/NotebookScriptService/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../Sources/NotebookScriptService/entitlements.plist
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: M94V58FCVP
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES

  NotebookMarkupService:
    type: xpc-service
    platform: macOS
    sources:
      - path: ../Sources/NotebookMarkupService/main.swift
      - path: ../Sources/NotebookMarkupService/Resources
        buildPhase: resources
    dependencies:
      - package: NotebookCore
        product: NotebookScriptWorker
    postBuildScripts:
      - name: Bundle pinned TypeScript compiler and SDK
        script: /bin/sh "$SRCROOT/bundle_notebook_typescript.sh"
        inputFiles:
          - $(SRCROOT)/bundle_notebook_typescript.sh
          - $(SRCROOT)/prepare_notebook_typescript.py
          - $(SRCROOT)/notebook_macho.py
          - $(SRCROOT)/NotebookTypeScriptResources.xcfilelist
          - $(SRCROOT)/../Sources/NotebookMarkupService/TypeScriptResources.lock.json
          - $(SRCROOT)/../Sources/NotebookScriptHost/Resources/notebook-sdk.d.ts
          - $(SRCROOT)/../Sources/NotebookMarkupService/typescript-child.entitlements.plist
          - $(NOTEBOOK_TYPESCRIPT_RUNTIME)
        outputFileLists:
          - $(SRCROOT)/NotebookTypeScriptResources.xcfilelist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook.markup-service$(NOTEBOOK_SCRIPT_BUNDLE_SUFFIX)
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ../Sources/NotebookMarkupService/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../Sources/NotebookMarkupService/entitlements.plist
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: M94V58FCVP
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES

  NotebookAcceptanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AcceptanceUITests
    dependencies:
      - target: Notebook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook.acceptance.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Notebook
        TARGETED_DEVICE_FAMILY: 2

  NotebookMacAcceptanceUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MacUITests
    dependencies:
      - target: NotebookMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook.mac$(NOTEBOOK_MAC_BUNDLE_SUFFIX).uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: NotebookMac

schemes:
  NotebookAcceptance:
    build:
      targets:
        Notebook: all
    test:
      targets:
        - NotebookAcceptanceUITests
      gatherCoverageData: false
  NotebookMacAcceptance:
    build:
      targets:
        NotebookMac: all
    test:
      targets:
        - NotebookMacAcceptanceUITests
      gatherCoverageData: false
