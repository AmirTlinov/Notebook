name: Notebook

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"

packages:
  NotebookCore:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ENABLE_MODULES: true

targets:
  Notebook:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iPad
      - path: Assets.xcassets
      - path: WebResources
        type: folder
        buildPhase: resources
    dependencies:
      - package: NotebookCore
        product: NotebookCore
    info:
      path: iPad/Info.plist
      properties:
        CFBundleDisplayName: $(NOTEBOOK_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Голосовой разговор передаёт речь в Codex через вашу существующую учётную запись. Микрофон включается только по вашему действию.
        NSLocalNetworkUsageDescription: Notebook связывает iPad с помощником на вашем Mac без облачного сервера.
        NSBonjourServices:
          - _notebook._tcp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook
        PRODUCT_NAME: Notebook
        NOTEBOOK_DISPLAY_NAME: Notebook
        MARKETING_VERSION: 0.3.33
        CURRENT_PROJECT_VERSION: 36
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VUNH73AYPY
        TARGETED_DEVICE_FAMILY: 2
        SUPPORTS_MACCATALYST: false
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
      testTargets:
        - NotebookTests
        - NotebookUITests

  NotebookTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests
      - path: TestSupport
    dependencies:
      - target: Notebook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook.tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: 2

  NotebookUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: UITests
    dependencies:
      - target: Notebook
    info:
      path: UITests/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook.uitests
        GENERATE_INFOPLIST_FILE: false
        TEST_TARGET_NAME: Notebook
        TARGETED_DEVICE_FAMILY: 2

  NotebookMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Mac
      - path: Assets.xcassets
      - path: WebResources
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Bundle Notebook tools
        script: |
          /usr/bin/env node "$SRCROOT/../MCP/build-sidecar.mjs" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/NotebookTools"
        inputFiles:
          - $(SRCROOT)/../MCP/src
          - $(SRCROOT)/../MCP/package-lock.json
          - $(SRCROOT)/../MCP/build-sidecar.mjs
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/NotebookTools/dist/index.mjs
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/NotebookTools/package.json
    dependencies:
      - package: NotebookCore
        product: NotebookCore
      - package: NotebookCore
        product: NotebookCodex
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Notebook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSLocalNetworkUsageDescription: Notebook принимает страницы с вашего iPad без облачного сервера.
        NSBonjourServices:
          - _notebook._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook.mac
        PRODUCT_NAME: Notebook
        MARKETING_VERSION: 0.3.33
        CURRENT_PROJECT_VERSION: 36
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VUNH73AYPY
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
      testTargets:
        - NotebookMacTests

  NotebookMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacTests
      - path: TestSupport
    dependencies:
      - target: NotebookMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirtlinov.notebook.mac.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Notebook.app/Contents/MacOS/Notebook
        BUNDLE_LOADER: $(TEST_HOST)
