<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src 'self' data: blob: notebook-program:; form-action 'none'; base-uri 'none'; object-src 'none';">
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfaf5;
      --ink: #171713;
      --muted: rgba(23, 23, 19, .55);
      --selection: rgba(46, 104, 255, .14);
      --page-width: 595px;
      --page-height: 842px;
      --page-radius: 3.4px;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      background: transparent;
    }
    body {
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.2083333333;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }
    #page-viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    #page-stage, #page-track, #page-backgrounds { position: relative; }
    #page-track {
      position: absolute;
      isolation: isolate;
    }
    #page-backgrounds {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .paper-sheet {
      position: absolute;
      top: 0;
      width: var(--page-width);
      height: var(--page-height);
      overflow: hidden;
      border-radius: var(--page-radius);
      background: transparent;
    }
    #document { position:absolute; z-index:1; margin:0; padding:0; }
    .block.editable { border-radius: .45rem; touch-action: manipulation; }
    .block.editable:active { background: rgba(23, 23, 19, .018); }
    .interactive-frame {
      display: block;
      width: 100%;
      border: 0;
      border-radius: .7rem;
      background: transparent;
      color-scheme: light;
    }
    .interactive-fragment {
      position: absolute;
      overflow: hidden;
    }

    ::selection { background: var(--selection); }
    ::-webkit-scrollbar { width: 0; height: 0; }
  </style>
  <script src="notebook-program.js"></script>
  <script src="document-program.js"></script>
  <script src="agent-feedback.js"></script>
</head>
<body>
  <div id="page-viewport" aria-label="Страницы документа">
    <div id="page-stage">
      <div id="page-track">
        <div id="page-backgrounds"></div>
        <main id="document" class="document-content" aria-label="Содержимое документа"></main>
        <div id="interactive-layer"></div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      'use strict';
      const root = document.getElementById('document');
      const viewport = document.getElementById('page-viewport');
      const stage = document.getElementById('page-stage');
      const track = document.getElementById('page-track');
      const backgrounds = document.getElementById('page-backgrounds');
      const interactiveLayer = document.getElementById('interactive-layer');
      const interactiveFrames = new Map();
      let payload = null;
      let sourceSnapshot = null;
      let stateSnapshot = null;
      let installedSourceKey = null;
      let appliedStateKey = null;
      let pageLayout = null;
      let measuredRegions = [];
      let layoutCanonical = false;
      const work = {sourceInstalls:0,pageInstalls:0,stateApplications:0,layoutPasses:0,regionMeasurements:0,typesetPasses:0,headingAddressProbes:0};
      let installedFragment = null;
      // An explicit native measurement attempt owns these bounded observations.
      // They never request pixels/layout or participate in page readiness.
      let preparationObservation = null;
      const observationMatches = (frame, observation = preparationObservation) => !!frame && !!observation
        && ['documentID','runtimeID','generation','sourceKey','stateKey','renderToken','pageIndex']
          .every(key => frame[key] === observation[key]);
      const observePreparation = observation => {
        if (!observation || typeof observation.attemptID !== 'string'
          || !['documentID','runtimeID','generation','sourceKey','stateKey','renderToken'].every(key => typeof observation[key] === 'string')
          || !Number.isInteger(observation.pageIndex)) return;
        if (preparationObservation?.attemptID === observation.attemptID) return;
        preparationObservation = {...observation, phasesMS: {}, states: {}};
      };
      const observeBrowserState = (observation, name) => {
        if (!observation || preparationObservation !== observation) return;
        // Reading FontFaceSet.status/size or geometry here could itself force
        // style/layout. Only document lifecycle flags are sampled before waits.
        observation.states[name] = {documentHidden: document.hidden ? 1 : 0,
          documentReadyState: ['loading','interactive','complete'].indexOf(document.readyState)};
      };
      let presentationEpoch = 0n;
      let presentationIsRendering = true;
      let lastTouchTap = null;

      const bridge = (message) => {
        const handler = window.webkit?.messageHandlers?.notebook;
        if (handler) handler.postMessage({ ...message, runtimeID: message.runtimeID ?? payload?.runtimeID });
      };

      // Native paper and its transparent interaction layer publish the same
      // immutable source; a pending generation is never a canonical screenshot.
      const presentationReceipt = () => payload && ({
        documentID:payload.documentID,runtimeID:payload.runtimeID,generation:payload.generation,
        sourceKey:payload.sourceKey,stateKey:payload.stateKey,renderToken:payload.renderToken,
        pageIndex:currentPageIndex(),presentationEpoch:String(presentationEpoch),
        presentationKind:presentationIsRendering || !layoutCanonical ? 'preparing' : 'canonical'
      });
      const presentationChanged = () => {
        if(presentationEpoch === 18446744073709551615n)throw new Error('Document presentation epoch exhausted');
        presentationEpoch += 1n;
        bridge({kind:'presentationChanged',...presentationReceipt()});
      };

      const canonical = value => Array.isArray(value) ? value.map(canonical)
        : value && typeof value === 'object' ? Object.fromEntries(Object.keys(value).sort().map(key => [key, canonical(value[key])])) : value;
      const stable = (value) => JSON.stringify(canonical(value ?? null));
      const stateFor = (block) => payload?.states
        && Object.prototype.hasOwnProperty.call(payload.states, block.id)
        ? payload.states[block.id]
        : (block.initialState ?? {});
      const currentPageIndex = () => pageLayout?.requestedPage ?? 0;

      const configurePaper = (nextPayload, requestedPage = currentPageIndex()) => {
        const paper = nextPayload.paper;
        // The native paper geometry owns typography. WebKit can report a
        // slightly different viewport subpixel after reparenting or resize;
        // that projection must never rescale an already measured source.
        const scale = Math.min(
          paper.surfaceWidth / paper.widthPoints,
          paper.surfaceHeight / paper.heightPoints
        );
        const pageWidth = paper.widthPoints * scale;
        const pageHeight = paper.heightPoints * scale;
        const margin = paper.marginPoints * scale;
        const gap = Math.max(18, Math.min(30, 22 * scale));
        const contentWidth = pageWidth - 2 * margin;
        const contentHeight = pageHeight - 2 * margin;
        const columnGap = 2 * margin + gap;
        const side = 0, top = 0;
        const stride = pageWidth + gap;
        pageLayout = {
          kind: paper.kind,
          pageWidth, pageHeight, margin, gap,
          contentWidth, contentHeight, columnGap,
          side, top, stride, requestedPage,
          pageCount: pageLayout?.pageCount || 1
        };
        const style = document.documentElement.style;
        viewport.style.width = `${pageWidth}px`;
        viewport.style.height = `${pageHeight}px`;
        style.setProperty('--page-width', `${pageWidth}px`);
        style.setProperty('--page-height', `${pageHeight}px`);
        style.setProperty('--page-radius', `${pageWidth * paper.cornerRadiusRatio}px`);
        track.style.top = `${top}px`;
        track.style.left = `${side}px`;
        // Page curl only changes placement of the same physical page.
        track.style.transform = `translate3d(${-requestedPage * stride}px, 0, 0)`;
        track.style.height = `${pageHeight}px`;
        stage.style.height = `${pageHeight}px`;
      };

      let runtimeDiagnostics = [];
      const diagnostic = (kind, message, blockID) => {
        runtimeDiagnostics.push({kind, message:String(message), ...(blockID ? {blockID} : {})});
        runtimeDiagnostics = runtimeDiagnostics.slice(-64);
      };
      const blockRegions = () => measuredRegions;

      const setPageIndex = (requestedIndex) => {
        if (!pageLayout || !payload || !Number.isInteger(requestedIndex)) {
          return null;
        }
        const index = Math.max(0, Math.min(pageLayout.pageCount - 1, requestedIndex));
        if (index !== installedFragment?.pageIndex) throw new Error('document_fragment_page_mismatch');
        pageLayout.requestedPage = index;
      };

      const pageReceipt = () => {
        if (!pageLayout || !payload) return null;
        return {
          ...presentationReceipt(),
          layoutCanonical, layoutScope:'page',
          work: {...work},
          renderToken: payload.renderToken,
          pageIndex: currentPageIndex(),
          pageCount: pageLayout.pageCount,
          width: pageLayout.pageWidth, height: pageLayout.pageHeight,
          regions: blockRegions(), diagnostics: runtimeDiagnostics,
          programs: [...interactiveFrames].map(([blockID, value]) => ({blockID, token:value.token,
            readiness:value.readiness || 'unknown'}))
        };
      };

      const interactiveDocument = (block, state, token) => {
        const safeID = JSON.stringify(block.id).replaceAll('<', '\\u003c');
        const safeState = JSON.stringify(state ?? null).replaceAll('<', '\\u003c');
        const safeScript = JSON.stringify(block.javaScript || '').replaceAll('<', '\\u003c');
        const safeToken = JSON.stringify(token);
        const safeCSS = String(block.css || '').replace(/<\/style/gi, '<\\/style');
        const csp = "default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src data:; media-src data: blob:; form-action 'none'; base-uri 'none'; object-src 'none';";
        const html = block.html || '';
        return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Content-Security-Policy" content="${csp}"><style>html,body{margin:0;min-height:100%;background:transparent;color:#171713;font-family:-apple-system,BlinkMacSystemFont,sans-serif}*{box-sizing:border-box}${safeCSS}</style><script>(()=>{
          (${installNotebookDocumentProgram.toString()})({blockID:${safeID},token:${safeToken},state:${safeState},
            requiresReady:${!!(String(block.javaScript || '').trim() || /<script/i.test(html))},script:${safeScript}},${createNotebookProgram.toString()});
        })()<\/script></head><body>${html}</body></html>`;
      };

      // Requests belong to the existing iframe, not to a second runtime or
      // global animation clock. Hidden-page and close fences share one pause.
      const programRequest = (runtime, channel) => {
        if(channel==='notebook-suspend' && runtime.checkpointRequest)return runtime.checkpointRequest;
        const requestID=crypto.randomUUID();runtime.lifecycleRequests??=new Map();
        const request=new Promise((resolve,reject)=>{
          const timer=setTimeout(()=>{runtime.lifecycleRequests.delete(requestID);reject(new Error('program_lifecycle_timeout'));},4200);
          runtime.lifecycleRequests.set(requestID,{resolve:value=>{clearTimeout(timer);resolve(value)},reject:error=>{clearTimeout(timer);reject(error)}});
          runtime.frame.contentWindow.postMessage({channel,token:runtime.token,requestID},'*');
        });
        if(channel==='notebook-suspend') {
          runtime.checkpointRequest=request;
          request.finally(()=>{if(runtime.checkpointRequest===request)runtime.checkpointRequest=null}).catch(()=>{});
        }
        return request;
      };
      const freezeProgram = async (blockID,runtime) => {
        const stateVersion=runtime.appliedVersion;
        const state=await programRequest(runtime,'notebook-suspend');
        runtime.appliedState=stable(state);
        return {blockID,token:runtime.token,state,stateVersion};
      };
      let programsSuspended = false, programsVisible = true;
      const checkpointPrograms = async () => {
        programsSuspended = true;
        return Promise.all([...interactiveFrames].filter(([,runtime])=>runtime.isStarted)
        .map(async ([blockID,runtime])=>{try{return await freezeProgram(blockID,runtime)}
          catch(error){return {blockID,token:runtime.token,error:String(error)}}}));
      };
      const resumePrograms = async () => {
        if(!programsVisible)return true;
        programsSuspended = false;
        await Promise.all([...interactiveFrames.values()].filter(runtime=>runtime.isStarted && runtime.visible)
          .map(runtime=>programRequest(runtime,'notebook-resume')));
        await applyInteractiveState();return true;
      };
      const acknowledgeProgramCheckpoint = (blockID,token,state,basis,version) => {
        const runtime=interactiveFrames.get(blockID);
        if(runtime?.token!==token || runtime.appliedState!==stable(state)
          || stable(runtime.appliedVersion)!==stable(basis))return;
        runtime.appliedVersion=version;
        const current=payload.stateVersions?.[blockID]??null;
        if(stable(current)===stable(basis) || stable(current)===stable(version)) {
          payload.states[blockID]=state;
          (payload.stateVersions??={})[blockID]=version;
        }
      };
      const acknowledgeProgramState = (blockID,token,revision,version) => {
        const runtime=interactiveFrames.get(blockID);
        if(runtime?.token===token && runtime.revision===revision)runtime.appliedVersion=version;
      };

      const positionInteractiveFrames = () => {
        for (const [blockID, runtime] of interactiveFrames) {
          const fragment = measuredRegions.find(region => region.id === blockID && region.pageIndex === currentPageIndex());
          runtime.container.style.visibility = fragment && programsVisible ? 'visible' : 'hidden';
          runtime.container.inert = !fragment || !programsVisible;
          const visible=!!fragment && programsVisible;
          if(runtime.isStarted && runtime.visible!==visible) {
            if(visible) {
              runtime.retirementID=null;
              if(!programsSuspended)programRequest(runtime,'notebook-resume').then(()=>applyInteractiveState()).catch(error=>diagnostic('program_lifecycle_error',error,blockID));
            }
            if(!visible || (programsSuspended && runtime.visible===undefined)) {
              const requestID=crypto.randomUUID();runtime.retirementID=requestID;
              freezeProgram(blockID,runtime).then(checkpoint=>{
                if((runtime.visible && !programsSuspended) || runtime.retirementID!==requestID)return;
                bridge({kind:'programCheckpoint',blockID,blockToken:runtime.token,
                  value:checkpoint.state,stateVersion:checkpoint.stateVersion});
                // Keep the context until the native writer acknowledges it.
              }).catch(error=>diagnostic('program_lifecycle_error',error,blockID));
            }
          }
          runtime.visible=visible;
          if (!fragment) continue;
          // A multi-column union is neither one page nor the program viewport.
          // Move the same full-height iframe behind its measured physical cut.
          Object.assign(runtime.container.style, {left:`${fragment.x + fragment.pageIndex * pageLayout.stride}px`,
            top:`${fragment.y}px`,width:`${fragment.width}px`,height:`${fragment.height}px`});
          Object.assign(runtime.frame.style, {position:'absolute',left:'0',top:`${-fragment.sourceOffset}px`,
            width:`${fragment.width}px`,height:`${runtime.height}px`});
        }
      };

      const setProgramsVisible = visible => {
        programsVisible=!!visible;
        // Native save/resume serializes returns; positioning cannot bypass it.
        if(!programsVisible)programsSuspended=true;
        positionInteractiveFrames();
      };

      // A program belongs to the mounted document runtime, not to a page cut.
      // Its native owner can show passive page pixels without another script.
      const ensureInteractiveFrame = (block, state, token) => {
        let runtime=interactiveFrames.get(block.id);
        if(runtime && runtime.token!==token){runtime.cancel();runtime.container.remove();interactiveFrames.delete(block.id);runtime=null;}
        if(!runtime) {
          const container=document.createElement('div');container.className='interactive-fragment';
          container.style.visibility='hidden';container.inert=true;
          const frame=document.createElement('iframe');frame.className='interactive-frame';frame.title=block.id;
          // A native-minted package has its own non-file origin. Retaining it permits workers,
          // but cannot expose this file-backed parent or another package's capability.
          frame.setAttribute('sandbox',block.programPackage?'allow-scripts allow-same-origin':'allow-scripts');frame.setAttribute('scrolling','no');frame.dataset.blockId=block.id;
          let resolve,reject;const started=new Promise((yes,no)=>{resolve=yes;reject=no});
          runtime={container,frame,token,started,resolve,reject,readiness:'unknown',isStarted:false,
            appliedState:stable(state),appliedVersion:payload.stateVersions?.[block.id]??null,revision:'0',cancel:()=>{
              for(const request of runtime.lifecycleRequests?.values()||[])request.reject(new Error('Interactive surface was superseded'));
              runtime.lifecycleRequests?.clear();frame.contentWindow?.postMessage({channel:'notebook-dispose',token},'*');reject(new Error('Interactive surface was superseded'))}};
          interactiveFrames.set(block.id,runtime);
          started.then(()=>{
            runtime.isStarted=true;runtime.visible=undefined;positionInteractiveFrames();
            bridge({kind:'programReady',blockID:block.id,blockToken:token});
          },()=>{});
          if(block.programPackage) {
            const url=payload.programURLs?.[block.id];
            if(!url)throw new Error('Program package capability is missing');
            frame.src=url;
          } else frame.srcdoc=interactiveDocument(block,state,token);
          container.append(frame);interactiveLayer.append(container);
        }
        runtime.height=block.height||320;runtime.initialState=block.initialState??{};
        return runtime;
      };

      // Iframes never belong to reordered flow nodes: detach/reinsert destroys
      // their browsing contexts, even when the JavaScript node stays identical.
      const prepareInteractiveFrames = async () => {
        if(payload.programMode==='external')return;
        const page=currentPageIndex();
        const visible=new Set(blockRegions().filter(region=>region.pageIndex===page).map(region=>region.id));
        const blocks=new Map((payload.blocks||[]).filter(block=>block.kind==='interactive').map(block=>[block.id,block]));
        for(const [blockID,runtime] of interactiveFrames) {
          if(runtime.token!==payload.blockTokens?.[blockID]) {
            runtime.cancel();runtime.container.remove();interactiveFrames.delete(blockID);
          }
        }
        for(const [blockID,block] of blocks)if(visible.has(blockID))
          ensureInteractiveFrame(block,stateFor(block),payload.blockTokens?.[blockID]);
        positionInteractiveFrames();
        await Promise.all([...interactiveFrames].filter(([id])=>visible.has(id)).map(([,runtime])=>runtime.started));
      };

      const applyInteractiveState = async () => {
        await Promise.all([...interactiveFrames].filter(([,runtime])=>runtime.visible).map(([blockID,runtime])=>new Promise((resolve,reject)=>{
          const nextState=Object.prototype.hasOwnProperty.call(payload.states,blockID)?payload.states[blockID]:runtime.initialState;
          const stateKey=stable(nextState),nextVersion=payload.stateVersions?.[blockID]??null;
          if(runtime.appliedState===stateKey){runtime.appliedVersion=nextVersion;resolve();return}
          const requestID=crypto.randomUUID(); runtime.stateRequestID=requestID; runtime.stateRejected=reject;
          runtime.stateApplied=accepted=>{if(accepted){runtime.appliedState=stateKey;runtime.appliedVersion=nextVersion}resolve()};
          runtime.frame.contentWindow.postMessage({channel:'notebook-state',token:runtime.token,
            requestID,state:nextState,revision:runtime.revision},'*');
        })));
      };

      const installPhysicalFragment = (job, fragmentDOM) => {
        const fragment=job.fragment;
        configurePaper(payload,fragment.pageIndex);
        if(Math.abs(pageLayout.pageWidth-fragment.width)>1/32 || Math.abs(pageLayout.pageHeight-fragment.height)>1/32) {
          throw new Error(`document_fragment_geometry_mismatch expected=${fragment.width}x${fragment.height} actual=${pageLayout.pageWidth}x${pageLayout.pageHeight}`);
        }
        work.pageInstalls+=1;
        pageLayout.pageCount=job.pageCount;
        installedFragment=fragment;
        const origin=fragment.pageIndex*pageLayout.stride;
        Object.assign(root.style,{left:`${origin}px`,top:`${fragment.contentTop}px`,width:`${fragment.width}px`,
          height:`${fragment.contentBottom-fragment.contentTop}px`,overflow:'hidden'});
        for(const node of [...fragmentDOM.children]) {
          node.style.top=`${parseFloat(node.style.top)-fragment.contentTop}px`;
        }
        root.replaceChildren(...fragmentDOM.childNodes);
        let sheet=backgrounds.firstElementChild;
        if(!sheet){sheet=document.createElement('section');backgrounds.append(sheet)}
        sheet.className='paper-sheet';sheet.style.left=`${origin}px`;
        sheet.setAttribute('role','region');sheet.setAttribute('aria-label',`Страница ${fragment.pageIndex+1}`
          +(job.layoutComplete?` из ${job.pageCount}`:''));
        sheet.dataset.page=String(fragment.pageIndex+1);sheet.dataset.paper=pageLayout.kind;
        track.style.width=`${fragment.width+origin}px`;backgrounds.style.height=`${fragment.height}px`;
        stage.style.width=`${fragment.width}px`;
        measuredRegions=fragment.regions;
        layoutCanonical=true;
        installedSourceKey=payload.sourceKey;
      };

      let requiredFrame = null;
      let retiredPresentation = null;
      let activeProgramPreparation = null;
      const frameIsRequired = frame => frame.runtimeID!==retiredPresentation
        && (!requiredFrame || (frame.runtimeID===requiredFrame.runtimeID
        && frame.generation===requiredFrame.generation));
      const requireFrame = frame => {
        if(typeof frame?.runtimeID!=='string' || !/^[0-9]{1,20}$/.test(frame?.generation || ''))
          throw new Error('document_frame_requirement_invalid');
        if(requiredFrame?.runtimeID===frame.runtimeID && BigInt(frame.generation)<BigInt(requiredFrame.generation))return;
        requiredFrame={runtimeID:frame.runtimeID,generation:frame.generation};
        if(activeProgramPreparation && !frameIsRequired(activeProgramPreparation.frame))
          activeProgramPreparation.controller.abort();
      };
      // Program readiness/state replies are logical subscriptions. Cancelling a
      // frame stops its wait; a retained program can serve the next generation.
      const waitForProgram = (promise, signal) => new Promise((resolve,reject)=>{
        const abort=()=>{signal.removeEventListener('abort',abort);reject(new DOMException('Document frame superseded','AbortError'))};
        Promise.resolve(promise).then(value=>{signal.removeEventListener('abort',abort);resolve(value)},
          error=>{signal.removeEventListener('abort',abort);reject(error)});
        if(signal.aborted){abort();return;}
        signal.addEventListener('abort',abort,{once:true});
      });
      const retirePresentation = runtimeID => {
        retiredPresentation=runtimeID;
        if(pendingFrame?.frame.runtimeID===runtimeID)pendingFrame=null;
        if(activeProgramPreparation?.frame.runtimeID===runtimeID)activeProgramPreparation.controller.abort();
        // An unstarted program has never admitted native input. End its actual
        // browsing context so an unresolved ready promise cannot retain a slot.
        if(payload?.runtimeID===runtimeID)for(const [id,runtime] of interactiveFrames)if(!runtime.isStarted) {
          runtime.cancel();runtime.container.remove();interactiveFrames.delete(id);
        }
      };
      const renderFrame = async (job) => {
        if(!frameIsRequired(job.frame))return;
        const observation = observationMatches(job.frame) ? preparationObservation : null;
        const startedAt = observation ? performance.now() : 0;
        const mark = name => {
          if (observation && preparationObservation === observation)
            observation.phasesMS['render_' + name] = performance.now() - startedAt;
        };
        mark('enter'); observeBrowserState(observation, 'render_enter');
        const localStates = job.refreshSource && payload?.stateKey === job.state.key ? payload.states : job.state.states;
        const previousPage = currentPageIndex();
        const sourceChanged = installedSourceKey !== job.source.key || job.refreshSource;
        const fragmentChanged = installedFragment !== job.fragment || sourceChanged;
        const stateChanged = appliedStateKey !== job.state.key;
        const modeChanged = payload?.programMode !== job.frame.programMode;
        let fragmentDOM = null;
        if (fragmentChanged) {
          // Text and images are already in the canonical PDF. This DOM owns
          // only hit regions, links and independently hosted live programs.
          fragmentDOM=document.createElement('div');fragmentDOM.innerHTML=job.fragment.html;
          mark('fragmentDOM');
        }
        if (pendingFrame || !frameIsRequired(job.frame)) return;
        currentFrame = job;
        payload = {...job.source,...job.frame,states:{...localStates},stateVersions:job.state.versions||{}};
        programsVisible=job.frame.programsVisible!==false;
        presentationIsRendering = true;
        presentationChanged();
        bridge({kind:'renderStarted',documentID:payload.documentID,renderToken:payload.renderToken,
          sourceKey:payload.sourceKey,stateKey:payload.stateKey,generation:payload.generation});
        if(fragmentChanged){
          runtimeDiagnostics=job.diagnostics.slice();installPhysicalFragment(job,fragmentDOM);
        }
        else setPageIndex(payload.pageIndex);
        mark('install');
        const dependency={frame:job.frame,controller:new AbortController()};
        activeProgramPreparation=dependency;
        try {
        if(fragmentChanged || previousPage !== currentPageIndex() || modeChanged){
          await waitForProgram(prepareInteractiveFrames(),dependency.controller.signal);
          if(!frameIsRequired(job.frame))return;
        }
        mark('programs');
        if(stateChanged || sourceChanged || previousPage !== currentPageIndex()){
          work.stateApplications += 1;
          await waitForProgram(applyInteractiveState(),dependency.controller.signal);
          if(!frameIsRequired(job.frame))return;
          appliedStateKey = job.state.key;
        }
        } finally { if(activeProgramPreparation===dependency)activeProgramPreparation=null; }
        mark('state');
        if(pendingFrame || !frameIsRequired(job.frame) || !currentFrame
          || ['documentID','renderToken','sourceKey','stateKey','generation','pageIndex'].some(key=>currentFrame.frame[key]!==job.frame[key]))return;
        presentationIsRendering = false;
        presentationChanged();
        mark('complete');
        bridge({kind:'rendered',documentID:payload.documentID,renderToken:payload.renderToken,
          sourceKey:payload.sourceKey,stateKey:payload.stateKey,generation:payload.generation,layoutCanonical,pageCount:pageLayout.pageCount});
      };

      const observedPageReceipt = async (index, waitsForFrames, attemptID) => {
        const observation = observationMatches(payload) && preparationObservation.attemptID === attemptID
          ? preparationObservation : null;
        const startedAt = observation ? performance.now() : 0;
        const phases = {};
        const mark = name => {
          if (observation) phases['receipt_' + name] = performance.now() - startedAt;
        };
        mark('enter'); observeBrowserState(observation, 'receipt_enter');
        setPageIndex(index); mark('setPage');
        if (waitsForFrames) await new Promise(resolve => requestAnimationFrame(() => {
          mark('raf1'); observeBrowserState(observation, 'receipt_raf1');
          requestAnimationFrame(() => {
            mark('raf2'); observeBrowserState(observation, 'receipt_raf2'); resolve();
          });
        }));
        const receipt = pageReceipt(); mark('complete');
        if (receipt && observation && preparationObservation === observation && observationMatches(payload, observation))
          receipt.preparationObservation = {attemptID: observation.attemptID,
            phasesMS: {...observation.phasesMS, ...phases}, states: {...observation.states}};
        return receipt;
      };

      // Each pending frame retains its immutable inputs. A newer source or
      // state packet cannot mutate the render that is already awaiting WebKit.
      let pendingFrame = null;
      let currentFrame = null;
      let renderTask = null;
      const installPageSource = async page => {
        if(page?.fragment?.sourceKey!==page?.source?.key || page.fragment.format!==1
          || !Number.isInteger(page.pageCount) || page.pageCount<=page.fragment.pageIndex
          || page.source.blocks.some(block=>!page.fragment.blockIDs.includes(block.id))) {
          throw new Error('document_page_source_invalid');
        }
        sourceSnapshot=page;
      };
      const applyState = state => { stateSnapshot = state; };
      // The source owner may finish navigation after this page is already
      // visible. Only its extent changes: no source install or paint restart.
      const acceptSourceExtent = (key,count) => {
        if(!Number.isInteger(count)||count<1||count>4096)throw new Error('document_layout_page_budget');
        const extend=job=>job?.source.key===key?{...job,pageCount:count,layoutComplete:true}:job;
        sourceSnapshot=extend(sourceSnapshot);pendingFrame=extend(pendingFrame);currentFrame=extend(currentFrame);
        if(installedSourceKey===key && pageLayout) {
          pageLayout.pageCount=count;
          backgrounds.firstElementChild?.setAttribute('aria-label',`Страница ${currentPageIndex()+1} из ${count}`);
        }
      };
      const enqueueFrame = job => {
        pendingFrame = job;
        // Abort only further submissions; the owner retains one template and
        // waits for every already-submitted decode before taking the latest job.
        if (!renderTask) {
          renderTask = (async () => {
            while (pendingFrame) {
              const next = pendingFrame;
              pendingFrame = null;
              try { await renderFrame(next); } catch(error) {
                if(error?.name==='AbortError' || pendingFrame || !frameIsRequired(next.frame))continue;
                diagnostic(error?.blockID ? 'image_error' : 'render_error',error,error?.blockID);
                bridge({kind:'renderFailed',documentID:next.frame.documentID,runtimeID:next.frame.runtimeID,
                  renderToken:next.frame.renderToken,sourceKey:next.frame.sourceKey,stateKey:next.frame.stateKey,
                  generation:next.frame.generation,message:String(error),blockID:error?.blockID});
              }
            }
          })().finally(() => { renderTask = null; });
        }
        return renderTask;
      };
      const presentPage = frame => {
        if(!sourceSnapshot || !stateSnapshot || frame.sourceKey !== sourceSnapshot.source.key
          || frame.stateKey !== stateSnapshot.key || frame.documentID !== sourceSnapshot.source.documentID
          || frame.documentID !== stateSnapshot.documentID){
          throw new Error('Document frame does not match its immutable source and state');
        }
        requireFrame(frame);
        return enqueueFrame({...sourceSnapshot,state:stateSnapshot,frame,refreshSource:false});
      };
      const refreshSourcePresentation = () => {
        const latest = pendingFrame || currentFrame;
        if(latest)enqueueFrame({...latest,refreshSource:true});
      };

      const beginEditing = (blockID, event) => {
        if (!payload?.editable) return;
        const block = payload.blocks.find(candidate => candidate.id === blockID);
        if (!block || block.kind === 'interactive') return;
        const rect = viewport.getBoundingClientRect();
        bridge({kind:'requestSource', ...presentationReceipt(), blockID,
          x:(event.clientX-rect.left)*viewport.clientWidth/rect.width,
          y:(event.clientY-rect.top)*viewport.clientHeight/rect.height});
      };

      const setEditingEnabled = enabled => {
        const updating = job => job && {...job,frame:{...job.frame,editable:enabled}};
        pendingFrame=updating(pendingFrame);currentFrame=updating(currentFrame);
        if(payload)payload.editable=enabled;
      };

      let linkActivationSequence = 0;
      root.addEventListener('click', event => {
        const link=event.target.closest('a[href]');
        // VoiceOver/keyboard activation has no pointer coordinates. Ordinary
        // finger clicks still require the completed double-tap path below.
        const section = event.target.closest('.block.editable');
        if (!link && section && event.isTrusted && event.detail === 0) {
          const box = section.getBoundingClientRect();
          beginEditing(section.dataset.blockId, {clientX:box.left+box.width/2,clientY:box.top+box.height/2});
          return;
        }
        if(!link || !root.contains(link))return;
        // Never scroll or navigate the leased WebKit: it owns exactly one
        // physical cut. The native presence owner opens the measured target.
        event.preventDefault();lastTouchTap=null;
        if(!payload || !layoutCanonical || presentationIsRendering)return;
        bridge({kind:'link',...presentationReceipt(),href:link.getAttribute('href'),
          activationSequence:String(++linkActivationSequence),userActivated:event.isTrusted});
      });
      root.addEventListener('keydown', event => {
        const section = event.target.closest('.block.editable');
        if (!section || !['Enter', ' '].includes(event.key)) return;
        event.preventDefault();
        const box = section.getBoundingClientRect();
        beginEditing(section.dataset.blockId, {clientX:box.left+box.width/2,clientY:box.top+box.height/2});
      });
      // Touch editing is admitted only by two completed single-finger taps.
      // Native paper gestures can deliver two nearby releases (or cancel one
      // contact); neither that pair nor its compatibility dblclick is a tap.
      const editingTouches = new Map();
      let editingPointerType = null;
      const rejectEditingTaps = () => {
        lastTouchTap = null;
        for (const touch of editingTouches.values()) touch.valid = false;
      };
      addEventListener('pointerdown', event => {
        editingPointerType = event.pointerType;
        if (event.pointerType !== 'touch') return;
        const section = event.target.closest('.block.editable');
        const valid = editingTouches.size === 0 && section && root.contains(section)
          && !event.target.closest('a[href]');
        if (!valid) rejectEditingTaps();
        editingTouches.set(event.pointerId, {blockID: section?.dataset.blockId,
          x: event.clientX, y: event.clientY, time: performance.now(), valid});
      });
      addEventListener('pointermove', event => {
        const touch = editingTouches.get(event.pointerId);
        if (touch && Math.hypot(event.clientX-touch.x, event.clientY-touch.y) > 10)
          rejectEditingTaps();
      });
      addEventListener('pointercancel', event => {
        if (event.pointerType !== 'touch') return;
        rejectEditingTaps();
        editingTouches.delete(event.pointerId);
      });
      root.addEventListener('dblclick', event => {
        if(event.target.closest('a[href]'))return;
        event.preventDefault();
        if (editingPointerType === 'touch') return;
        const section = event.target.closest('.block.editable');
        if (section) beginEditing(section.dataset.blockId, event);
      });
      addEventListener('pointerup', event => {
        if (event.pointerType !== 'touch') return;
        const touch = editingTouches.get(event.pointerId);
        editingTouches.delete(event.pointerId);
        const section = event.target.closest('.block.editable');
        const now = performance.now();
        if (!touch?.valid || editingTouches.size || !section || !root.contains(section)
          || section.dataset.blockId !== touch.blockID || event.target.closest('a[href]')
          || now-touch.time > 360
          || Math.hypot(event.clientX-touch.x, event.clientY-touch.y) > 10) {
          lastTouchTap = null; return;
        }
        const tap = {
          blockID: section.dataset.blockId,
          x: event.clientX,
          y: event.clientY,
          time: now
        };
        if (lastTouchTap
          && lastTouchTap.blockID === tap.blockID
          && now - lastTouchTap.time <= 360
          && Math.hypot(tap.x - lastTouchTap.x, tap.y - lastTouchTap.y) <= 28) {
          event.preventDefault();
          lastTouchTap = null;
          beginEditing(tap.blockID, event);
        } else {
          lastTouchTap = tap;
        }
      });
      addEventListener('message', event => {
        const message=event.data;
        if(!payload||!message?.channel?.startsWith('notebook-'))return;
        const found=[...interactiveFrames].find(([,runtime])=>runtime.frame.contentWindow===event.source);
        if(!found)return;
        const [blockID,runtime]=found;
        if(message.token!==runtime.token)return;
        if(message.channel==='notebook-program-focus'){
          runtime.focused=message.focused===true;
          bridge({kind:'programFocus',blockID,blockToken:runtime.token,focused:message.focused===true});return;
        }
        if(message.channel==='notebook-program-flushed'||message.channel==='notebook-program-resumed'){
          const request=runtime.lifecycleRequests?.get(message.requestID);
          runtime.lifecycleRequests?.delete(message.requestID);request?.resolve(message.state??true);return;
        }
        if(message.channel==='notebook-diagnostic'){diagnostic(message.kind,message.message,blockID);if(message.kind==='program_ready_error'||message.kind==='javascript_error')runtime.reject(new Error(message.message));return}
        if(message.channel==='notebook-program-started'){runtime.resolve();return}
        if(message.channel==='notebook-program-ready'){runtime.readiness='declared';return}
        if(message.channel==='notebook-state-applied'){if(message.requestID===runtime.stateRequestID)runtime.stateApplied?.(message.accepted);return}
        if(message.channel==='notebook-program-error'){
          const request=runtime.lifecycleRequests?.get(message.requestID);
          runtime.lifecycleRequests?.delete(message.requestID);request?.reject(new Error(message.message));
          if(message.requestID===runtime.stateRequestID)runtime.stateRejected?.(new Error(message.message));
          else if(message.requestID===runtime.retirementID)diagnostic('program_lifecycle_error',message.message,blockID);return;
        }
        if(message.channel!=='notebook-interactive')return;
        payload.states[blockID]=message.state;runtime.revision=message.revision;
        runtime.appliedState=stable(message.state);
        bridge({kind:'state',documentID:payload.documentID,blockID,blockToken:runtime.token,value:message.state,revision:message.revision});
      });
      addEventListener('dragstart', event => event.preventDefault());
      window.notebookRenderer = {
        installPageSource, acceptSourceExtent,
        blurPrograms:()=>{for(const runtime of interactiveFrames.values())if(runtime.focused)
          runtime.frame.contentWindow.postMessage({channel:'notebook-navigation-blur',token:runtime.token},'*');return true;},
        applyState, checkpointPrograms, resumePrograms, setProgramsVisible, acknowledgeProgramState, acknowledgeProgramCheckpoint,
        presentPage, requireFrame, retirePresentation, observePreparation, observedPageReceipt,
        setPageIndex,
        pageReceipt,
        presentationReceipt,
        setEditingEnabled
      };
      bridge({ kind: 'ready' });
      bridge({ kind: 'commonRuntimeReady' });
    })();
  </script>
</body>
</html>
