<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src 'self' data: blob:; form-action 'none'; base-uri 'none'; object-src 'none';">
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfaf5;
      --ink: #171713;
      --muted: rgba(23, 23, 19, .55);
      --selection: rgba(46, 104, 255, .14);
      --page-width: 595px;
      --page-height: 842px;
      --page-radius: 3.4px;
      --page-margin: 71px;
      --page-gap: 24px;
      --content-width: 453px;
      --content-height: 700px;
      --column-gap: 166px;
      --body-font-size: 12px;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      background: transparent;
    }
    body {
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: var(--body-font-size);
      line-height: 1.2083333333;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }
    #page-viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    #page-stage, #page-track, #page-backgrounds { position: relative; }
    #page-track {
      position: absolute;
      isolation: isolate;
    }
    #page-backgrounds {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .paper-sheet {
      position: absolute;
      top: 0;
      width: var(--page-width);
      height: var(--page-height);
      overflow: hidden;
      border-radius: var(--page-radius);
      background: var(--paper);
    }
    #document {
      position: absolute;
      z-index: 1;
      top: var(--page-margin);
      left: var(--page-margin);
      width: var(--content-width);
      height: var(--content-height);
      margin: 0;
      padding: 0;
      column-width: var(--content-width);
      column-gap: var(--column-gap);
      column-fill: auto;
      overflow: visible;
    }
    .block { position: relative; margin: 0 0 .75em; }
    .block.interactive, .block.latex, pre { break-inside: avoid-column; }
    .block.editable { border-radius: .45rem; touch-action: manipulation; }
    .block.editable:active { background: rgba(23, 23, 19, .018); }
    /* The 12-point article scale also used by the default TeX export:
       body 12/14.5, section 17.28/22, subsection 14.4/18 points. */
    h1, h2, h3, h4, h5, h6 {
      font-weight: 700;
      letter-spacing: normal;
      margin: 1.25em 0 .5em;
      break-after: avoid-column;
    }
    h1 { font-size: 1.44em; line-height: 1.2731481481; }
    h2 { font-size: 1.2em; line-height: 1.25; }
    h3, h4, h5, h6 { font-size: 1em; line-height: 1.2083333333; }
    #document > .block:first-child > :first-child { margin-top: 0; }
    p, ul, ol, blockquote, pre, table { margin: 0 0 .5em; }
    ul, ol { padding-left: 1.45em; }
    blockquote { margin-left: 0; padding-left: 1em; color: var(--muted); border-left: 2px solid rgba(23,23,19,.14); }
    code { font-family: ui-monospace, "SFMono-Regular", monospace; font-size: .86em; }
    :not(pre) > code { padding: .12em .32em; background: rgba(23,23,19,.055); border-radius: .28em; }
    pre { overflow-x: auto; padding: 1em; background: rgba(23,23,19,.045); border-radius: .55em; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .45em .6em; text-align: left; border-bottom: 1px solid rgba(23,23,19,.11); }
    a { color: inherit; text-decoration-thickness: .06em; text-underline-offset: .14em; }
    img, svg { max-width: 100%; }
    .latex { overflow-x: auto; padding: .2em 0; text-align: center; }
    .interactive-frame {
      display: block;
      width: 100%;
      border: 0;
      border-radius: .7rem;
      background: transparent;
      color-scheme: light;
    }
    .interactive-fragment {
      position: absolute;
      overflow: hidden;
    }
    .source-editor {
      position: absolute;
      display: block;
      min-height: 9rem;
      resize: none;
      overflow: auto;
      margin: 0;
      padding: .8rem .9rem;
      border: 0;
      border-radius: .55rem;
      outline: 2px solid rgba(46, 104, 255, .24);
      outline-offset: 0;
      background: rgba(255,255,255,.7);
      color: var(--ink);
      font: 500 .86em/1.55 ui-monospace, "SFMono-Regular", monospace;
      caret-color: #1e65f3;
      box-shadow: 0 .6rem 2rem rgba(30, 42, 68, .08);
      -webkit-user-select: text;
      user-select: text;
      touch-action: manipulation;
      pointer-events: auto;
    }
    #editor-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: auto;
    }
    #editor-layer:empty { display: none; }
    .empty-hint { color: var(--muted); font-style: italic; }
    ::selection { background: var(--selection); }
    ::-webkit-scrollbar { width: 0; height: 0; }
  </style>
  <script>
    window.MathJax = {
      startup: { typeset: false },
      loader: { load: ['a11y/assistive-mml'] },
      output: { fontPath: new URL('fonts/%%FONT%%-font', location.href).href },
      // Native screen readers consume local MathML; the page renderer owns
      // a complete offline frame, including the mathematical glyphs.
      options: {
        enableMenu: false,
        menuOptions: { settings: {
          enrich: false, speech: false, braille: false, assistiveMml: true
        } }
      },
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      svg: { fontCache: 'local' }
    };
  </script>
  <script src="marked.umd.js"></script>
  <script src="purify.min.js"></script>
  <script src="tex-svg-nofont.js"></script>
</head>
<body>
  <div id="page-viewport" aria-label="Страницы документа">
    <div id="page-stage">
      <div id="page-track">
        <div id="page-backgrounds"></div>
        <main id="document" aria-label="Содержимое документа"></main>
        <div id="interactive-layer"></div>
        <div id="editor-layer"></div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      'use strict';
      const root = document.getElementById('document');
      const viewport = document.getElementById('page-viewport');
      const stage = document.getElementById('page-stage');
      const track = document.getElementById('page-track');
      const backgrounds = document.getElementById('page-backgrounds');
      const editorLayer = document.getElementById('editor-layer');
      const interactiveLayer = document.getElementById('interactive-layer');
      const interactiveFrames = new Map();
      let payload = null;
      let sourceSnapshot = null;
      let stateSnapshot = null;
      let installedSourceKey = null;
      let appliedStateKey = null;
      let pageLayout = null;
      let measuredRegions = [];
      let layoutCanonical = false;
      const work = {sourceInstalls:0,stateApplications:0,layoutPasses:0,regionMeasurements:0,typesetPasses:0};
      let editingBlockID = null;
      let presentationEpoch = 0n;
      let presentationIsRendering = true;
      let activeEditorFinish = null;
      let activeEditorLayout = null;
      let activeEditor = null;
      const finishedSessionIDs = new Set();
      let lastTouchTap = null;

      const bridge = (message) => {
        const handler = window.webkit?.messageHandlers?.notebook;
        if (handler) handler.postMessage({ ...message, runtimeID: payload?.runtimeID });
      };

      // Source layout and the pixels currently covering it have different
      // owners. An editor never becomes a canonical-source screenshot merely
      // because the underlying block still has the same signature.
      const presentationReceipt = () => payload && ({
        documentID:payload.documentID,runtimeID:payload.runtimeID,generation:payload.generation,
        sourceKey:payload.sourceKey,stateKey:payload.stateKey,renderToken:payload.renderToken,
        pageIndex:currentPageIndex(),presentationEpoch:String(presentationEpoch),
        presentationKind:editingBlockID ? 'editor' : presentationIsRendering || !layoutCanonical ? 'preparing' : 'canonical'
      });
      const presentationChanged = () => {
        if(presentationEpoch === 18446744073709551615n)throw new Error('Document presentation epoch exhausted');
        presentationEpoch += 1n;
        bridge({kind:'presentationChanged',...presentationReceipt()});
      };

      const canonical = value => Array.isArray(value) ? value.map(canonical)
        : value && typeof value === 'object' ? Object.fromEntries(Object.keys(value).sort().map(key => [key, canonical(value[key])])) : value;
      const stable = (value) => JSON.stringify(canonical(value ?? null));
      const stateFor = (block) => payload?.states
        && Object.prototype.hasOwnProperty.call(payload.states, block.id)
        ? payload.states[block.id]
        : (block.initialState ?? {});
      const signatureFor = (block) => stable({
        kind: block.kind,
        source: block.source,
        html: block.html,
        css: block.css,
        javaScript: block.javaScript
      });

      const currentPageIndex = () => pageLayout?.requestedPage ?? 0;

      const configurePaper = (nextPayload, requestedPage = currentPageIndex()) => {
        const paper = nextPayload.paper;
        const viewportBounds = viewport.getBoundingClientRect();
        const viewportWidth = Math.max(1, viewportBounds.width);
        const viewportHeight = Math.max(1, viewportBounds.height);
        // The native owner gives this view exactly one physical sheet. The
        // same ratio scales typesetting; surrounding space belongs to the scene.
        const scale = Math.min(
          viewportWidth / paper.widthPoints,
          viewportHeight / paper.heightPoints
        );
        const pageWidth = paper.widthPoints * scale;
        const pageHeight = paper.heightPoints * scale;
        const margin = paper.marginPoints * scale;
        const gap = Math.max(18, Math.min(30, 22 * scale));
        const contentWidth = pageWidth - 2 * margin;
        const contentHeight = pageHeight - 2 * margin;
        const columnGap = 2 * margin + gap;
        const side = (viewportWidth - pageWidth) / 2;
        const top = (viewportHeight - pageHeight) / 2;
        const stride = pageWidth + gap;
        pageLayout = {
          kind: paper.kind,
          pageWidth, pageHeight, margin, gap,
          contentWidth, contentHeight, columnGap,
          side, top, stride, requestedPage,
          pageCount: pageLayout?.pageCount || 1
        };
        const style = document.documentElement.style;
        style.setProperty('--page-width', `${pageWidth}px`);
        style.setProperty('--page-height', `${pageHeight}px`);
        style.setProperty('--page-radius', `${pageWidth * paper.cornerRadiusRatio}px`);
        style.setProperty('--page-margin', `${margin}px`);
        style.setProperty('--page-gap', `${gap}px`);
        style.setProperty('--content-width', `${contentWidth}px`);
        style.setProperty('--content-height', `${contentHeight}px`);
        style.setProperty('--column-gap', `${columnGap}px`);
        style.setProperty('--body-font-size', `${12 * scale}px`);
        track.style.top = `${top}px`;
        track.style.left = `${side}px`;
        // Page curl reparents and resizes a prewarmed WKWebView. Geometry owns
        // the fixed page in the same layout transaction as its new size.
        track.style.transform = `translate3d(${-requestedPage * stride}px, 0, 0)`;
        track.style.height = `${pageHeight}px`;
        stage.style.height = `${viewportHeight}px`;
      };

      const paginate = (requestedPage = pageLayout?.requestedPage ?? 0) => {
        if (!pageLayout) return 1;
        work.layoutPasses += 1;
        const { contentWidth, columnGap, pageWidth, pageHeight, gap, side, stride } = pageLayout;
        const extent = Math.max(contentWidth, root.scrollWidth);
        const pageCount = Math.max(
          1,
          Math.round((extent + columnGap) / (contentWidth + columnGap))
        );
        const trackWidth = pageCount * pageWidth + (pageCount - 1) * gap;
        track.style.width = `${trackWidth}px`;
        backgrounds.style.width = `${trackWidth}px`;
        backgrounds.style.height = `${pageHeight}px`;
        stage.style.width = `${trackWidth + 2 * side}px`;
        for (let index = 0; index < pageCount; index += 1) {
          const sheet = backgrounds.children[index]
            || backgrounds.appendChild(document.createElement('section'));
          sheet.className = 'paper-sheet';
          sheet.style.left = `${index * stride}px`;
          sheet.setAttribute('role', 'region');
          sheet.setAttribute('aria-label', `Страница ${index + 1} из ${pageCount}`);
          sheet.dataset.page = String(index + 1);
          sheet.dataset.paper = pageLayout.kind;
        }
        while (backgrounds.children.length > pageCount) {
          backgrounds.lastElementChild.remove();
        }
        const page = Math.max(0, Math.min(pageCount - 1, requestedPage));
        pageLayout.pageCount = pageCount;
        pageLayout.requestedPage = page;
        track.style.transform = `translate3d(${-page * stride}px, 0, 0)`;
        return pageCount;
      };

      let runtimeDiagnostics = [];
      const diagnostic = (kind, message, blockID) => {
        runtimeDiagnostics.push({kind, message:String(message), ...(blockID ? {blockID} : {})});
        runtimeDiagnostics = runtimeDiagnostics.slice(-64);
      };
      const measureBlockRegions = () => {
        work.regionMeasurements += 1;
        if (!pageLayout) return [];
        const {stride,side,top,pageWidth,pageHeight,requestedPage} = pageLayout;
        const viewportRect = viewport.getBoundingClientRect();
        return [...root.children].flatMap(node => {
          let sourceOffset = 0;
          return [...node.getClientRects()].map(rect => {
            const x = rect.x - viewportRect.x + requestedPage * stride - side;
            const pageIndex = Math.max(0,Math.floor(x / stride));
            const left = Math.max(0,x - pageIndex * stride);
            const y = Math.max(0,rect.y - viewportRect.y - top);
            const region = {id:node.dataset.blockId,pageIndex,x:left,y,
              width:Math.min(rect.width,pageWidth-left),height:Math.min(rect.height,pageHeight-y),sourceOffset};
            sourceOffset += rect.height;
            return region;
          }).filter(rect => rect.width > 0 && rect.height > 0);
        });
      };

      const blockRegions = () => measuredRegions;

      const setPageIndex = (requestedIndex) => {
        if (!pageLayout || !payload || !Number.isInteger(requestedIndex)) {
          return null;
        }
        const maximum = Math.max(0, (pageLayout.pageCount || 1) - 1);
        const index = Math.max(0, Math.min(maximum, requestedIndex));
        if (index === pageLayout.requestedPage) return;
        track.style.transform = `translate3d(${-index * pageLayout.stride}px, 0, 0)`;
        pageLayout.requestedPage = index;
      };

      const pageReceipt = () => {
        if (!pageLayout || !payload) return null;
        return {
          ...presentationReceipt(),
          layoutCanonical,
          work: {...work},
          renderToken: payload.renderToken,
          pageIndex: currentPageIndex(),
          pageCount: pageLayout.pageCount,
          width: pageLayout.pageWidth, height: pageLayout.pageHeight,
          regions: blockRegions(), diagnostics: runtimeDiagnostics,
          programs: [...interactiveFrames].map(([blockID, value]) => ({blockID, token:value.token,
            readiness:value.readiness || 'unknown'}))
        };
      };

      const schedulePagination = () => {
        if (!payload) return;
        paginate(currentPageIndex());
        measuredRegions = measureBlockRegions();
        positionInteractiveFrames();
        activeEditorLayout?.();
      };

      const interactiveDocument = (block, state, token) => {
        const safeID = JSON.stringify(block.id).replaceAll('<', '\\u003c');
        const safeState = JSON.stringify(state ?? null).replaceAll('<', '\\u003c');
        const safeScript = JSON.stringify(block.javaScript || '').replaceAll('<', '\\u003c');
        const safeToken = JSON.stringify(token);
        const safeCSS = String(block.css || '').replace(/<\/style/gi, '<\\/style');
        const csp = "default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src data:; media-src data: blob:; form-action 'none'; base-uri 'none'; object-src 'none';";
        const html = block.html || '';
        return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Content-Security-Policy" content="${csp}"><style>html,body{margin:0;min-height:100%;background:transparent;color:#171713;font-family:-apple-system,BlinkMacSystemFont,sans-serif}*{box-sizing:border-box}${safeCSS}</style></head><body>${html}<script>(()=>{
          const blockID=${safeID}, token=${safeToken};
          const post=message=>parent.postMessage({...message,blockID,token},'*');
          const report=(kind,message)=>post({channel:'notebook-diagnostic',kind,message:String(message)});
          addEventListener('error',e=>report('javascript_error',e.message));
          addEventListener('unhandledrejection',e=>report('javascript_error',e.reason));
          let value=${safeState};
          const stable=value=>JSON.stringify(value,(_,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(k=>[k,v[k]])):v);
          let declaredReady=null;
          window.notebook=Object.freeze({
            get state(){return value},
            commit(next){if(stable(value)===stable(next))return;value=next;post({channel:'notebook-interactive',state:next})},
            ready(promise){declaredReady=Promise.resolve(promise);declaredReady.then(()=>post({channel:'notebook-program-ready'}),error=>report('program_ready_error',error));return declaredReady}
          });
          addEventListener('message',event=>{
            if(event.source!==parent||event.data?.channel!=='notebook-state'||event.data.token!==token)return;
            const next=event.data.state;
            if(stable(value)!==stable(next)){value=next;dispatchEvent(new CustomEvent('notebookstate',{detail:value}))}
            post({channel:'notebook-state-applied',requestID:event.data.requestID});
          });
          addEventListener('load',async()=>{
            await document.fonts.ready;
            await Promise.all([...document.images].map(image=>image.decode().catch(()=>{})));
            if(document.body.scrollHeight>innerHeight+1||document.body.scrollWidth>innerWidth+1)report('overflow','Content exceeds its frame');
            for(const image of document.images)if(!image.naturalWidth)report('load_error','Image failed to load');
            try{await declaredReady;post({channel:'notebook-program-started'})}
            catch(error){report('program_ready_error',error)}
          });
          try{const script=document.createElement('script');script.textContent=${safeScript};document.body.append(script)}catch(error){report('javascript_error',error)}
        })()<\/script></body></html>`;
      };

      const positionInteractiveFrames = () => {
        for (const [blockID, runtime] of interactiveFrames) {
          const fragment = measuredRegions.find(region => region.id === blockID && region.pageIndex === currentPageIndex());
          runtime.container.hidden = !fragment;
          if (!fragment) continue;
          // A multi-column union is neither one page nor the program viewport.
          // Move the same full-height iframe behind its measured physical cut.
          Object.assign(runtime.container.style, {left:`${fragment.x + fragment.pageIndex * pageLayout.stride}px`,
            top:`${fragment.y}px`,width:`${fragment.width}px`,height:`${fragment.height}px`});
          Object.assign(runtime.frame.style, {position:'absolute',left:'0',top:`${-fragment.sourceOffset}px`,
            width:`${fragment.width}px`,height:`${runtime.height}px`});
        }
      };

      // Iframes never belong to reordered flow nodes: detach/reinsert destroys
      // their browsing contexts, even when the JavaScript node stays identical.
      const prepareInteractiveFrames = async () => {
        const page = currentPageIndex();
        const visible = new Set(blockRegions().filter(region => region.pageIndex === page).map(region => region.id));
        const blocks = new Map((payload.blocks || []).filter(block => block.kind === 'interactive').map(block => [block.id,block]));
        for (const [blockID, runtime] of interactiveFrames) {
          if (!visible.has(blockID) || !blocks.has(blockID) || runtime.token !== payload.blockTokens?.[blockID]) {
            runtime.container.remove(); runtime.cancel(); interactiveFrames.delete(blockID);
          }
        }
        for (const [blockID, block] of blocks) {
          if (!visible.has(blockID)) continue;
          let runtime = interactiveFrames.get(blockID);
          if (!runtime) {
            const container = document.createElement('div');
            container.className = 'interactive-fragment';
            const frame = document.createElement('iframe');
            frame.className = 'interactive-frame'; frame.title = blockID;
            frame.setAttribute('sandbox','allow-scripts'); frame.setAttribute('scrolling','no');
            frame.dataset.blockId = blockID;
            let resolve, reject;
            const started = new Promise((yes,no) => {resolve=yes;reject=no});
            runtime = {container,frame,token:payload.blockTokens?.[blockID],started,resolve,reject,readiness:'unknown',
              appliedState:stable(stateFor(block)),
              cancel:()=>reject(new Error('Interactive surface was superseded'))};
            interactiveFrames.set(blockID,runtime);
            frame.srcdoc = interactiveDocument(block,stateFor(block),runtime.token);
            container.append(frame);
            interactiveLayer.append(container);
          }
          runtime.height = block.height || 320;
        }
        positionInteractiveFrames();
        await Promise.all([...interactiveFrames.values()].map(runtime=>runtime.started));
        if (payload.programMode === 'headless') for (const [blockID, runtime] of interactiveFrames) {
          if (runtime.readiness !== 'declared' && blocks.get(blockID)?.javaScript) {
            diagnostic('program_completion_unknown', 'This is a captured frame. The program has not declared completion with notebook.ready(promise).', blockID);
          }
        }
      };

      const applyInteractiveState = async () => {
        const blocks = new Map((payload.blocks || []).filter(block => block.kind === 'interactive').map(block => [block.id,block]));
        await Promise.all([...interactiveFrames].map(([blockID,runtime])=>new Promise(resolve=>{
          const block = blocks.get(blockID);
          if(!block){resolve();return}
          const nextState=stateFor(block), stateKey=stable(nextState);
          if(runtime.appliedState===stateKey){resolve();return}
          const requestID=crypto.randomUUID(); runtime.stateRequestID=requestID; runtime.stateApplied=resolve;
          runtime.appliedState=stateKey;
          runtime.frame.contentWindow.postMessage({channel:'notebook-state',token:runtime.token,
            requestID,state:nextState},'*');
        })));
      };

      const createBlock = (block) => {
        const section = document.createElement('section');
        section.className = `block ${block.kind === 'interactive' ? 'interactive' : 'editable'}`;
        section.dataset.blockId = block.id;
        section.dataset.kind = block.kind;
        section.dataset.signature = signatureFor(block);

        if (block.kind === 'interactive') {
          section.dataset.height = String(block.height || 320);
          section.style.height = `${block.height || 320}px`;
        } else if (block.kind === 'latex') {
          section.classList.add('latex');
          const source = block.source || '';
          const ownsDisplayMath = /^\s*(\$\$|\\\[|\\begin\s*\{(?:equation|align|alignat|gather|multline|flalign)\*?\})/.test(source);
          section.textContent = ownsDisplayMath ? source : `\\[${source}\\]`;
        } else {
          const source = block.source || '';
          section.innerHTML = source
            ? DOMPurify.sanitize(marked.parse(source), {
                USE_PROFILES: { html: true, svg: true, svgFilters: true },
                FORBID_TAGS: ['script', 'iframe', 'object', 'embed'],
                FORBID_ATTR: ['style', 'onerror', 'onload']
              })
            : '<p class="empty-hint">Дважды коснитесь, чтобы начать писать.</p>';
        }
        return section;
      };

      const typeset = async (nodes) => {
        if (nodes.length === 0) return;
        work.typesetPasses += 1;
        try {
          await window.MathJax?.startup?.promise;
          if (typeof window.MathJax?.typesetPromise !== 'function') {
            throw new Error('MathJax runtime did not finish loading');
          }
          await MathJax.typesetPromise(nodes);
          for (const node of nodes) {
            if (node.classList.contains('latex')) {
              if (!node.querySelector('mjx-container')) {
                throw new Error(`LaTeX block ${node.dataset.blockId} stayed unrendered`);
              }
            }
            node.dataset.mathState = 'rendered';
          }
        } catch (error) {
          for (const node of nodes) node.dataset.mathState = 'error';
          for (const node of nodes) diagnostic('latex_error', error, node.dataset.blockId);
        }
      };

      const renderSource = async () => {
        work.sourceInstalls += 1;
        configurePaper(payload, payload.pageIndex);
        const oldByID = new Map([...root.children].map(node => [node.dataset.blockId, node]));
        const nextNodes = [];
        const typesetNodes = [];

        for (const block of payload.blocks || []) {
          const old = oldByID.get(block.id);
          const signature = signatureFor(block);
          if (old && (old.dataset.signature === signature || editingBlockID === block.id)) {
            if (block.kind === 'interactive') {
              old.dataset.height = String(block.height || 320); old.style.height = `${block.height || 320}px`;
            }
            nextNodes.push(old);
            oldByID.delete(block.id);
            continue;
          }
          if (old) {
            if (window.MathJax?.typesetClear) MathJax.typesetClear([old]);
            old.remove();
          }
          const node = createBlock(block);
          nextNodes.push(node);
          if (block.kind !== 'interactive') typesetNodes.push(node);
          oldByID.delete(block.id);
        }

        for (const node of oldByID.values()) {
          if (window.MathJax?.typesetClear) MathJax.typesetClear([node]);
        }
        for (const node of oldByID.values()) node.remove();
        nextNodes.forEach((node,index) => { if(root.children[index]!==node)root.insertBefore(node,root.children[index]||null) });
        await typeset(typesetNodes);
        await document.fonts.ready;
        await Promise.all([...root.querySelectorAll('img')].map(image=>image.decode().catch(()=>{})));
        paginate(payload.pageIndex);
        measuredRegions = measureBlockRegions();
        // A peer may edit the same source while this textarea owns a draft.
        // Keep that editor and its old flow node, but do not certify that mixed
        // presentation as the new canonical layout.
        layoutCanonical = (payload.blocks || []).every((block,index) =>
          root.children[index]?.dataset.signature === signatureFor(block));
        installedSourceKey = payload.sourceKey;
      };

      const renderFrame = async (job) => {
        currentFrame = job;
        const localStates = job.refreshSource && payload?.stateKey === job.state.key ? payload.states : job.state.states;
        const previousPage = currentPageIndex();
        const sourceChanged = installedSourceKey !== job.source.key || job.refreshSource;
        const stateChanged = appliedStateKey !== job.state.key;
        const modeChanged = payload?.programMode !== job.frame.programMode;
        payload = {...job.source,...job.frame,states:{...localStates}};
        presentationIsRendering = true;
        presentationChanged();
        bridge({kind:'renderStarted',documentID:payload.documentID,renderToken:payload.renderToken,
          sourceKey:payload.sourceKey,stateKey:payload.stateKey,generation:payload.generation});
        if(sourceChanged){runtimeDiagnostics=[];await renderSource()}
        else setPageIndex(payload.pageIndex);
        if(sourceChanged || previousPage !== currentPageIndex() || modeChanged){
          await prepareInteractiveFrames();
          activeEditorLayout?.();
          restoreEditor();
        }
        if(stateChanged || sourceChanged || previousPage !== currentPageIndex()){
          work.stateApplications += 1;
          await applyInteractiveState();
          appliedStateKey = job.state.key;
        }
        presentationIsRendering = false;
        presentationChanged();
        bridge({kind:'rendered',documentID:payload.documentID,renderToken:payload.renderToken,
          sourceKey:payload.sourceKey,stateKey:payload.stateKey,generation:payload.generation,layoutCanonical,pageCount:pageLayout.pageCount});
      };

      // Each pending frame retains its immutable inputs. A newer source or
      // state packet cannot mutate the render that is already awaiting WebKit.
      let pendingFrame = null;
      let currentFrame = null;
      let renderTask = null;
      const installSource = source => { sourceSnapshot = source; };
      const applyState = state => { stateSnapshot = state; };
      const enqueueFrame = job => {
        pendingFrame = job;
        if (!renderTask) {
          renderTask = (async () => {
            while (pendingFrame) {
              const next = pendingFrame;
              pendingFrame = null;
              try { await renderFrame(next); } catch(error) {
                diagnostic('render_error',error);
                bridge({kind:'renderFailed',documentID:next.frame.documentID,
                  renderToken:next.frame.renderToken,sourceKey:next.frame.sourceKey,stateKey:next.frame.stateKey,
                  generation:next.frame.generation,message:String(error)});
              }
            }
          })().finally(() => { renderTask = null; });
        }
        return renderTask;
      };
      const presentPage = frame => {
        if(!sourceSnapshot || !stateSnapshot || frame.sourceKey !== sourceSnapshot.key
          || frame.stateKey !== stateSnapshot.key || frame.documentID !== sourceSnapshot.documentID
          || frame.documentID !== stateSnapshot.documentID){
          throw new Error('Document frame does not match its immutable source and state');
        }
        return enqueueFrame({source:sourceSnapshot,state:stateSnapshot,frame,refreshSource:false});
      };
      const refreshSourcePresentation = () => {
        const latest = pendingFrame || currentFrame;
        if(latest)enqueueFrame({...latest,refreshSource:true});
      };

      const beginEditing = (blockID, restored = null) => {
        if (!payload?.editable || editingBlockID) return;
        const block = payload.blocks.find(candidate => candidate.id === blockID);
        if (!block || block.kind === 'interactive') return;
        const section = [...root.children].find(node => node.dataset.blockId === blockID);
        if (!section) return;
        if (window.MathJax?.typesetClear) MathJax.typesetClear([section]);
        editingBlockID = blockID;
        presentationChanged();
        const minimumHeight = 144;
        let editorTop = pageLayout.margin;
        const editor = document.createElement('textarea');
        editor.className = 'source-editor';
        editor.value = restored?.edit.source ?? block.source ?? '';
        const edit = restored?.edit || {sessionID:crypto.randomUUID(),documentID:payload.documentID,blockID,
          baseSource:block.source || '',baseVersion:payload.sourceVersions[blockID],source:editor.value,sequence:0};
        let sequence = edit.sequence, composing = false, waitingForCommit = false, lastDraft = restored;
        const reportDraft = () => {
          if(waitingForCommit)return lastDraft;
          if(lastDraft?.edit.source===editor.value && lastDraft.selectionStart===editor.selectionStart
            && lastDraft.selectionEnd===editor.selectionEnd && lastDraft.isComposing===composing)return lastDraft;
          sequence += 1;
          lastDraft={
            edit:{...edit,source:editor.value,sequence},selectionStart:editor.selectionStart,selectionEnd:editor.selectionEnd,
            isComposing:composing,phase:'editing'};
          bridge({kind:'draft',documentID:edit.documentID,blockID,session:lastDraft});
          return lastDraft;
        };
        editor.addEventListener('compositionstart',()=>{composing=true;reportDraft()});
        editor.addEventListener('compositionend',()=>{composing=false;reportDraft()});
        editor.addEventListener('input',reportDraft);
        editor.addEventListener('select',reportDraft);
        editor.setAttribute('aria-label', 'Исходный Markdown или LaTeX');
        editor.setAttribute('autocomplete', 'off');
        editor.setAttribute('autocorrect', 'off');
        editor.setAttribute('autocapitalize', 'none');
        editor.setAttribute('spellcheck', 'false');
        editor.setAttribute('autofocus', '');
        editor.setAttribute('inputmode', 'text');
        section.style.visibility = 'hidden';
        editorLayer.append(editor);
        const fitEditor = () => {
          const available = Math.max(
            minimumHeight,
            pageLayout.pageHeight - pageLayout.margin - editorTop
          );
          editor.style.height = '1px';
          editor.style.height = `${Math.min(
            available,
            Math.max(minimumHeight, editor.scrollHeight + 4)
          )}px`;
        };
        const positionEditor = () => {
          const sectionRect = section.getBoundingClientRect();
          const trackRect = track.getBoundingClientRect();
          const page = currentPageIndex();
          editorTop = Math.max(
            pageLayout.margin,
            Math.min(
              sectionRect.top - trackRect.top,
              pageLayout.pageHeight - pageLayout.margin - minimumHeight
            )
          );
          editor.style.left = `${page * pageLayout.stride + pageLayout.margin}px`;
          editor.style.top = `${editorTop}px`;
          editor.style.width = `${pageLayout.contentWidth}px`;
          fitEditor();
        };
        positionEditor();
        activeEditorLayout = positionEditor;
        editor.addEventListener('input', fitEditor);
        const focusEditor = () => {
          editor.focus({ preventScroll: true });
        };
        editor.addEventListener('pointerdown', focusEditor);
        editor.addEventListener('click', focusEditor);
        editor.addEventListener('touchend', focusEditor);
        // iPadOS will show the software keyboard only when focus is claimed
        // inside the double-tap event itself. Deferring this call even by one
        // task leaves a visible editor with no keyboard.
        if(!restored)editor.focus({ preventScroll: true });
        editor.setSelectionRange(restored?.selectionStart ?? editor.value.length, restored?.selectionEnd ?? editor.value.length);
        if(!restored)reportDraft();

        const status = document.createElement('div');
        status.className='source-editor-status'; status.setAttribute('role','status');
        Object.assign(status.style,{position:'absolute',left:editor.style.left,top:`${editorTop-28}px`,
          font:'13px -apple-system',background:'white',padding:'4px',zIndex:2});
        editorLayer.append(status);
        const close = () => {
          editor.remove(); status.remove(); section.style.visibility='';
          editingBlockID=null; activeEditorFinish=null; activeEditorLayout=null; activeEditor=null;
          presentationIsRendering=true;
          presentationChanged();
        };
        const finish = commit => {
          if(waitingForCommit||composing)return;
          if(!commit){
            finishedSessionIDs.add(edit.sessionID.toLowerCase());
            bridge({kind:'discardDraft',documentID:edit.documentID,blockID,sessionID:edit.sessionID});
            close(); refreshSourcePresentation(); return;
          }
          reportDraft(); waitingForCommit=true; editor.readOnly=true;
          status.textContent='Сохранение…';
          bridge({kind:'source',documentID:edit.documentID,blockID,edit:{...edit,source:editor.value,sequence}});
        };
        activeEditor = {sessionID:edit.sessionID,reportDraft,suspend:()=>{
          const draft=reportDraft(); editor.readOnly=true; editor.blur(); close(); return draft;
        },complete:(result)=>{
          if(result.sequence!==sequence)return;
          waitingForCommit=false;editor.readOnly=false;
          if(result.status==='committed'){
            finishedSessionIDs.add(edit.sessionID.toLowerCase());
            close(); refreshSourcePresentation();
          }else{
            status.textContent=result.status==='conflict'?'Исходник изменился. Ваш черновик сохранён.'
              :result.status==='targetMissing'?'Блок удалён. Ваш черновик сохранён.':'Не удалось сохранить. Черновик остаётся здесь.';
          }
        }};
        activeEditorFinish = finish;
        editor.addEventListener('keydown', event => {
          if (event.key === 'Escape') { event.preventDefault(); finish(false); }
          if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
            event.preventDefault(); finish(true);
          }
        });
      };

      const restoreEditor = () => {
        if(!payload?.editable||editingBlockID)return;
        const draft=(payload.drafts||[]).find(draft=>draft.edit.documentID===payload.documentID
          && !['committed','discarded'].includes(draft.phase) && !finishedSessionIDs.has(draft.edit.sessionID.toLowerCase())
          && blockRegions().some(region=>region.id===draft.edit.blockID&&region.pageIndex===currentPageIndex()));
        if(draft)beginEditing(draft.edit.blockID,draft);
      };

      const setEditingEnabled = (enabled, drafts = []) => {
        // Editing authority belongs to the host, not to a source job that may
        // have been queued before UIKit handed this ready page to the person.
        const updating = job => job && {...job,frame:{...job.frame,editable:enabled,
          drafts:enabled ? drafts : job.frame.drafts}};
        pendingFrame=updating(pendingFrame);currentFrame=updating(currentFrame);
        if(!payload)return null;
        if(!enabled){
          const draft=activeEditor?.suspend() || null;
          payload.editable=false;
          if(draft)refreshSourcePresentation();
          return draft;
        }
        payload.editable=true;payload.drafts=drafts;restoreEditor();return null;
      };

      root.addEventListener('dblclick', event => {
        event.preventDefault();
        const section = event.target.closest('.block.editable');
        if (section) beginEditing(section.dataset.blockId);
      });
      editorLayer.addEventListener('pointerdown', event => {
        if (event.target === editorLayer) activeEditorFinish?.(true);
      });
      root.addEventListener('pointerup', event => {
        if (event.pointerType !== 'touch') return;
        const section = event.target.closest('.block.editable');
        if (!section) { lastTouchTap = null; return; }
        const now = performance.now();
        const tap = {
          blockID: section.dataset.blockId,
          x: event.clientX,
          y: event.clientY,
          time: now
        };
        if (lastTouchTap
          && lastTouchTap.blockID === tap.blockID
          && now - lastTouchTap.time <= 360
          && Math.hypot(tap.x - lastTouchTap.x, tap.y - lastTouchTap.y) <= 28) {
          event.preventDefault();
          lastTouchTap = null;
          beginEditing(tap.blockID);
        } else {
          lastTouchTap = tap;
        }
      });
      addEventListener('pagehide', () => activeEditor?.reportDraft());
      addEventListener('message', event => {
        const message=event.data;
        if(!payload||!message?.channel?.startsWith('notebook-'))return;
        const found=[...interactiveFrames].find(([,runtime])=>runtime.frame.contentWindow===event.source);
        if(!found)return;
        const [blockID,runtime]=found;
        if(message.token!==runtime.token)return;
        if(message.channel==='notebook-diagnostic'){diagnostic(message.kind,message.message,blockID);return}
        if(message.channel==='notebook-program-started'){runtime.resolve();return}
        if(message.channel==='notebook-program-ready'){runtime.readiness='declared';return}
        if(message.channel==='notebook-state-applied'){if(message.requestID===runtime.stateRequestID)runtime.stateApplied?.();return}
        if(message.channel!=='notebook-interactive')return;
        payload.states[blockID]=message.state;
        runtime.appliedState=stable(message.state);
        bridge({kind:'state',documentID:payload.documentID,blockID,blockToken:runtime.token,value:message.state});
      });
      addEventListener('dragstart', event => event.preventDefault());
      // The laid-out viewport owns paper size, including a shrink back after
      // expansion. Window resize can arrive before WebKit updates this box.
      let lastViewportWidth = null, lastViewportHeight = null;
      new ResizeObserver(() => {
        if (!payload) return;
        const bounds = viewport.getBoundingClientRect();
        if(bounds.width === lastViewportWidth && bounds.height === lastViewportHeight)return;
        lastViewportWidth=bounds.width;lastViewportHeight=bounds.height;
        const requestedPage = currentPageIndex();
        configurePaper(payload, requestedPage);
        schedulePagination();
      }).observe(viewport);

      window.notebookRenderer = {
        installSource,
        applyState,
        presentPage,
        setPageIndex,
        pageReceipt,
        presentationReceipt,
        setEditingEnabled,
        completeSourceEdit: result => {if(activeEditor?.sessionID.toLowerCase()===result.sessionID.toLowerCase())activeEditor.complete(result)}
      };
      bridge({ kind: 'ready' });
    })();
  </script>
</body>
</html>
