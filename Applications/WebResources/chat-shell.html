<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'; img-src 'none'; connect-src 'none'">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;margin:0;padding:16px 22px 24px;color:#242424;background:transparent;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
article{position:relative;margin:0 0 22px;line-height:1.55}
.role{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
article[data-role="user"]{display:flex;justify-content:flex-end}
article[data-role="user"] .content{max-width:88%;padding:10px 16px;border-radius:20px;background:#eaf3fd}
p{margin:0 0 12px}p:last-child{margin-bottom:0}
h1,h2,h3{font-size:1.15em;line-height:1.4;margin:20px 0 10px}
ul,ol{padding-left:22px}li+li{margin-top:5px}
pre{white-space:pre-wrap;padding:14px;border-radius:14px;background:#f5f5f5;line-height:1.5}
code{font:13px ui-monospace,SFMono-Regular,monospace}
p code,li code{padding:2px 4px;border-radius:4px;background:#f3f3f3}
blockquote{margin:12px 0;padding-left:14px;border-left:2px solid #d8d8d8;color:#666}
mjx-container{max-width:100%;overflow:auto}a{color:inherit;text-underline-offset:3px}
hr{border:0;border-top:1px solid #e9e9e9;margin:20px 0}
.save-answer{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:4px 0 0 -12px;border:0;border-radius:10px;padding:0;background:transparent;color:#777;cursor:pointer}
.save-answer:hover,.save-answer:focus-visible{background:#f3f3f3;color:#242424}
.save-answer svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
small{display:block;font-size:12px;color:#888;margin-top:8px}
article[data-kind="activity"]{margin:0 0 8px;color:#737373;font-size:12px;line-height:1.5}
summary{list-style:none}summary::-webkit-details-marker{display:none}summary::marker{content:''}
article[data-kind="activity"] summary{display:flex;gap:8px;align-items:baseline;cursor:pointer;overflow-wrap:anywhere}
article[data-kind="activity"] pre{color:#666;font-size:12px;max-height:260px;overflow:auto}
article[data-status="inProgress"] summary{color:#555}
.work{margin:0 0 20px;color:#737373;font-size:12px;border-bottom:1px solid #ededed;padding-bottom:8px}
.work>summary{display:flex;gap:8px;align-items:baseline;cursor:pointer;min-height:30px;line-height:1.5;padding:6px 0}
.work>summary .work-label{display:inline-block;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.work[open]>summary{margin-bottom:10px}
.work article{padding-left:10px;border-left:1px solid #ececec}
article[data-status="inProgress"]{color:#444}article[data-status="failed"],article[data-status="declined"]{color:#ac3934}
.activity-label{display:flex;gap:8px;align-items:baseline}
.activity-icon{display:inline-block;width:15px;height:15px;flex:none;align-self:flex-start;margin-top:2px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.long-message>summary{display:flex;gap:8px;align-items:baseline;cursor:pointer}.long-message[open]>summary{font-size:12px;color:#737373;margin-bottom:12px}
table{border-collapse:collapse;display:block;max-width:100%;overflow-x:auto}td,th{text-align:left;padding:8px;border-bottom:1px solid #e9e9e9}
</style>
<script>window.MathJax={startup:{typeset:false},loader:{load:['a11y/assistive-mml']},output:{fontPath:new URL('fonts/mathjax-newcm-font',location.href).href},options:{enableMenu:false,menuOptions:{settings:{enrich:false,speech:false,braille:false,assistiveMml:true}}},tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']],processEscapes:true},svg:{fontCache:'local'}};</script>
<script src="marked.umd.js"></script><script src="purify.min.js"></script><script src="tex-svg-nofont.js"></script>
</head><body><main id="messages"></main><script>
const escapeMath=text=>text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// Icons name the native activity. Disclosure remains the summary's action;
// neither a generic play triangle nor tool-provided markup owns its appearance.
const activityIcons={
 command:'<rect x="2.5" y="3.5" width="19" height="17" rx="3"/><path d="m7 8 4 4-4 4m7 0h3"/>',
 files:'<path d="M14 2.5H6a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8.5L14 2.5ZM14 3v6h6M8 13h8m-8 4h6"/>',
 tool:'<path d="M14 4a6 6 0 0 0-7 7L2.5 15.5a3 3 0 0 0 4 4L11 15a6 6 0 0 0 8-8l-4 4-3-3 4-4Z"/>',
 search:'<circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/>',
 image:'<rect x="2.5" y="3.5" width="19" height="17" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m3 18 6-5 4 3 4-5 4 5"/>',
 plan:'<rect x="5" y="4" width="15" height="18" rx="2"/><rect x="9" y="2" width="7" height="4" rx="1"/><path d="m8 11 1 1 2-2m3 1h3m-9 6 1 1 2-2m3 1h3"/>',
 compaction:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M7 9h10M7 12h10M7 15h7"/>',
 error:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/>',
 work:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
function activityIcon(kind){const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('viewBox','0 0 24 24');icon.setAttribute('aria-hidden','true');icon.setAttribute('class','activity-icon');icon.dataset.icon=kind;icon.innerHTML=activityIcons[kind]||activityIcons.tool;return icon;}
// Math is tokenized before Markdown can consume TeX backslashes or underscores.
marked.use({extensions:[
 {name:'mathBlock',level:'block',start:src=>src.search(/\$\$|\\\[/),tokenizer(src){const m=/^(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\])(?:\n|$)/.exec(src);if(m)return{type:'mathBlock',raw:m[0]};},renderer:token=>`<div>${escapeMath(token.raw)}</div>`},
 {name:'mathInline',level:'inline',start:src=>src.search(/\$|\\\(/),tokenizer(src){const m=/^(\\\([\s\S]*?\\\)|\$(?!\$)[^\n$]+?\$)/.exec(src);if(m)return{type:'mathInline',raw:m[0]};},renderer:token=>`<span>${escapeMath(token.raw)}</span>`}
]});
let next=null,running=false;
window.showMessages=async function(json){
 next=JSON.parse(json);if(running)return;running=true;
 try{await MathJax.startup.promise;while(next){const messages=next;next=null;
 const follows=scrollY+innerHeight>=document.documentElement.scrollHeight-60;
 const root=document.getElementById('messages');const expanded=new Set([...root.querySelectorAll('details[open]')].map(x=>x.dataset.key));MathJax.typesetClear([root]);root.replaceChildren();
 let group=null,groupEnd=-1;
 for(let index=0;index<messages.length;index++){const m=messages[index];const article=document.createElement('article');article.dataset.itemId=m.id;
 if(index>groupEnd)group=null;
 if(m.activity&&!group){let end=index;while(end+1<messages.length&&messages[end+1].activity&&messages[end+1].turnID===m.turnID)end++;
   if(end>index){group=document.createElement('details');group.className='work';group.dataset.key='work:'+m.id;group.open=expanded.has(group.dataset.key);groupEnd=end;
     const items=messages.slice(index,end+1),current=items.find(x=>x.activity.status==='inProgress'),failed=items.some(x=>['failed','declined'].includes(x.activity.status));
     const summary=document.createElement('summary'),label=document.createElement('span');label.className='work-label';
     const count=items.length,word=count%10===1&&count%100!==11?'действие':count%10>=2&&count%10<=4&&(count%100<12||count%100>14)?'действия':'действий';
     label.textContent=current?current.text:(failed?'Есть ошибка · ':'Выполнено · ')+count+' '+word;summary.append(activityIcon(current?.activity.kind||(failed?'error':'work')),label);group.append(summary);root.append(group);
   }
 }
 const destination=group||root;
 if(m.activity){
   article.dataset.kind='activity';article.dataset.status=m.activity.status||'';
   if(m.activity.detail){
     const details=document.createElement('details');details.dataset.key='item:'+m.id;details.open=expanded.has(details.dataset.key);
     const summary=document.createElement('summary'),label=document.createElement('span');label.textContent=m.text;summary.append(activityIcon(m.activity.kind),label);details.append(summary);
     const body=document.createElement('pre');body.textContent=m.activity.detail;details.append(body);article.append(details);
   }else{
     const label=document.createElement('div'),text=document.createElement('span');label.className='activity-label';text.textContent=m.text;label.append(activityIcon(m.activity.kind),text);article.append(label);
   }
   if(m.isTruncated){const note=document.createElement('small');note.textContent='Показан фрагмент. Полное содержание — в Codex.';article.append(note);}
   destination.append(article);continue;
 }
 article.dataset.role=m.role==='user'?'user':'assistant';const role=document.createElement('b');role.className='role';role.textContent=m.role==='user'?'Вы':'Codex';article.append(role);
 const content=document.createElement('div');content.className='content';content.innerHTML=DOMPurify.sanitize(marked.parse(m.text),{ALLOWED_URI_REGEXP:/^(?:(?:https?|mailto|notebook):|[#/]|[^a-zA-Z])/,FORBID_TAGS:['img','iframe','form','input','button','style'],FORBID_ATTR:['style']});if(m.role==='user'&&m.text.length>900){const full=document.createElement('details');full.className='long-message';full.dataset.key='message:'+m.id;full.open=expanded.has(full.dataset.key);const preview=document.createElement('summary');const previewText=document.createElement('span');previewText.textContent=m.text.slice(0,180)+'…';preview.append(activityIcon('files'),previewText);full.append(preview);while(content.firstChild)full.append(content.firstChild);content.append(full);}article.append(content);if(m.isTruncated){const note=document.createElement('small');note.textContent='Показан фрагмент сообщения. Полный текст — в Codex.';article.append(note);}if(m.role==='assistant'){const save=document.createElement('button');save.type='button';save.className='save-answer';save.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6M7 8h8M7 12h4M18 14v8M14 18h8"/></svg>';save.setAttribute('aria-label','Сохранить ответ в заметках');save.title='Сохранить ответ в заметках';save.addEventListener('click',()=>window.webkit?.messageHandlers?.notebookChat?.postMessage({action:'save',id:m.id}));article.append(save);}root.append(article);}
 await MathJax.typesetPromise([root]);if(follows)scrollTo(0,document.documentElement.scrollHeight);
 }}finally{running=false;}
};
</script></body></html>
