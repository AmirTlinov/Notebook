# Pinned together with NotebookAgentRuntimeProfile and the real provider-catalog test.
model = "gpt-5.5"
model_provider = "openai"
forced_login_method = "chatgpt"
web_search = "disabled"
approval_policy = "never"
sandbox_mode = "read-only"
project_doc_max_bytes = 0
cli_auth_credentials_store = "file"

[tools]
experimental_request_user_input = { enabled = false }
update_plan = { enabled = false }

[skills]
include_instructions = false
[skills.bundled]
enabled = false
[orchestrator.skills]
enabled = false
[orchestrator.mcp]
enabled = false
[history]
persistence = "none"
[agents]
enabled = false

[features]
apps = false
plugins = false
remote_plugin = false
tool_suggest = false
skill_search = false
goals = false
sleep_tool = false
view_image = false
image_generation = false
browser_use = false
browser_use_external = false
computer_use = false
code_mode_host = false
hooks = false
workspace_dependencies = false
request_permissions_tool = false
multi_agent = false
shell_tool = false
unified_exec = false
enable_request_compression = false
unbounded_connection_retries = false
skip_host_skill_discovery = true
[features.code_mode]
enabled = false
direct_only_tool_namespaces = ["notebook"]
