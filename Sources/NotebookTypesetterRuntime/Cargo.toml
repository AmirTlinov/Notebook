[package]
name = "notebook-typesetter-runtime"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
wasi-common = { version = "=36.0.15", default-features = false, features = ["sync"] }
wiggle = { version = "=36.0.15", default-features = false }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
memmap2 = "=0.9.11"
[profile.release]
lto = "thin"
